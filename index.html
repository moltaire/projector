// Rail warnings are rendered by three different functions and rebuilt constantly, so the
// jump is delegated once here rather than re-bound on every render.
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-issue]');
  if(!b) return;
  e.preventDefault();
  gotoIssue(b.dataset.issue,+b.dataset.from,+b.dataset.span);
});
document.addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(el('overlay').style.display==='flex'){
    if(e.key==='Escape'){ closeModal(); return; }
    if(xstate){                                   // guided cell queue
      const n=xstate.cells.length;
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); copyCurrent(); }
      else if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); xstate.i=Math.min(n-1,xstate.i+1); paintExport(); }
      else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); xstate.i=Math.max(0,xstate.i-1); paintExport(); }
    }
    return;
  }
  const k=e.key.toLowerCase();
  if(e.key==='?'){ e.preventDefault(); openShortcuts(); return; }
  if(k==='w'){ const order=['day','week','month']; viewMode=order[(order.indexOf(viewMode)+1)%3]; selectedId=null; render(); return; }
  if(k==='t'){ selectedDate=new Date(todayMid()); selectedId=null; render(); return; }
  if(e.key==='ArrowLeft'){ e.preventDefault(); el('prev').click(); return; }
  if(e.key==='ArrowRight'){ e.preventDefault(); el('next').click(); return; }
  if(viewMode!=='day') return;                    // editing keys are day-view only
  // --- fast labeling ---
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); assignHotkey(+e.key); return; }
  if(e.key==='Enter'){ e.preventDefault(); focusDesc(); return; }
  if(e.key==='Tab'){ e.preventDefault(); gotoBlock(e.shiftKey?-1:1); return; }
  if(k==='n'){ e.preventDefault(); gotoNextUnlabeled(); return; }
  if(k==='c'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); copyLabel(); return; }
  if(k==='v'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); pasteLabel(); return; }
  if(k==='s'){ splitAtPlayhead(); }
  else if(k==='m'){ mergeSelected(); }
  else if(k==='p'){ e.preventDefault(); openQuickPick(); }
  else if(k==='l'){ e.preventDefault(); focusDesc(); }
  else if(e.key==='Delete'||e.key==='Backspace'){ if(selectedId){ e.preventDefault(); deleteBlock(selectedId); } }
  else if(e.key==='ArrowUp'){ e.preventDefault(); nudgePlayhead(-1); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); nudgePlayhead(1); }
  else if(e.key==='Escape'){ selectedId=null; render(); }
});

/* ============================ positions manager ============================ */
function openPositions(){
  // Archived positions are hidden, not resurrected by past usage — but they stay one toggle
  // away so an accidental delete is recoverable.
  const vis=p=>showArchivedPos||posVisible(p);
  const kidsOf=id=>state.positions.filter(p=>p.parentId===id);
  const parents=state.positions.filter(p=>!p.parentId&&!p.reserved&&!p.archived);
  const hkOpts=p=>[1,2,3,4,5,6,7,8,9].map(n=>`<option value="${n}"${p.hotkey===n?' selected':''}>${n}</option>`).join('');

  const rowFor=(p,depth)=>{
    const container=!isBookable(p), bill=isBillable(p), inh=!!p.parentId&&!p.color;
    const preset=isPreset(p);
    return `<div class="prow${p.archived?' arch':''}" data-p="${p.id}">
      ${container
        ? `<span class="dim" style="text-align:center;font-size:11px">–</span>`
        : `<select data-f="hotkey" title="${t('hotkey')}">
             <option value=""${p.hotkey?'':' selected'}>–</option>${hkOpts(p)}
           </select>`}
      ${preset
        ? `<div class="tagfield"><span>${t('wgTag')}</span>
             <input type="text" class="taginp" value="${esc(p.wg||'')}" data-f="wg"
                    placeholder="${t('wgPh')}" title="${t('wgTag')}"></div>`
        : `<input type="text" value="${esc(p.code)}" data-f="code" ${p.reserved?'disabled':''}>`}
      <div class="lab-wrap">${p.parentId?`<span class="kid${depth>1?' d2':''}">└</span>`:''}
        <input type="text" value="${esc(p.label)}" data-f="label" ${p.reserved?'disabled':''}></div>
      ${p.reserved?'<span></span>':`<select data-f="parentId" title="${t('parentPos')}">
        <option value=""${p.parentId?'':' selected'}>${t('noParent')}</option>
        ${parents.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}"${p.parentId===x.id?' selected':''}>${esc(x.label)}</option>`).join('')}
      </select>`}
      ${p.reserved?'<span></span>':`<select data-f="billable" title="${t('billability')}">
        <option value=""${p.billable==null?' selected':''}>${p.parentId?`(${bill?t('billYes'):t('billNo')})`:t('billInherit')}</option>
        <option value="1"${p.billable===true?' selected':''}>${t('billYes')}</option>
        <option value="0"${p.billable===false?' selected':''}>${t('billNo')}</option>
      </select>`}
      <div class="tagcell">${
        preset ? `<div class="tagfield"><span>${t('prjTag')}</span>
                    <input type="text" class="taginp" value="${esc(p.prj||'')}" data-f="prj"
                           placeholder="${esc(tagNone())}" title="${t('prjTag')}"></div>`
        : p.reserved ? ''
        : `<label class="chk" title="${t('taggedPos')} — ${t('taggedHint')}">
             <input type="checkbox" data-f="tagged" ${p.tagged?'checked':''}>
           </label>`}</div>
      <div class="colcell">
        <input type="color" class="${inh?'inh':''}" value="${posColor(p)}" data-f="color"
               title="${inh?t('colorInherited'):''}" ${p.reserved?'disabled':''}>
        ${!p.reserved&&p.parentId&&p.color?`<button class="mini" data-act="uncolor" title="${t('colorReset')}">↺</button>`:''}
      </div>
      ${p.reserved?`<span class="dim" style="font-size:10px">${t('locked')}</span>`
        :p.archived?`<button class="mini" data-act="unarch" title="${t('unarchive')}">↩</button>`
                  :`<button class="mini" data-act="del" title="${t('archive')}">✕</button>`}
    </div>`;
  };

  // Under a Themenarbeit code the rows are laid out as the third level they only look
  // like: the Hub row, then every PEG row repeating that Hub, indented.
  const orderKids=(par,kids)=>{
    if(!isTagged(par)) return kids.map(k=>[k,1]);
    const out=[], used=new Set();
    kids.filter(k=>!k.prj).forEach(w=>{
      out.push([w,1]); used.add(w.id);
      // `used` also guards against a second Hub row carrying the same tag: without it every
      // PEG row under that tag would be drawn once per Hub row claiming it.
      kids.filter(k=>k.prj&&!used.has(k.id)&&(k.wg||'')===(w.wg||''))
        .forEach(k=>{ out.push([k,2]); used.add(k.id); });
    });
    kids.filter(k=>!used.has(k.id)).forEach(k=>out.push([k,1]));
    return out;
  };
  let rows='';
  state.positions.filter(p=>!p.parentId&&vis(p)).forEach(p=>{
    rows+=rowFor(p,0);
    orderKids(p,kidsOf(p.id).filter(vis)).forEach(([c,d])=>{ rows+=rowFor(c,d); });
  });

  openModal(`<h2>${t('positions')}</h2>
    <div class="ptable">
      <div class="ph" style="text-align:center">${t('hotkey')}</div>
      <div class="ph">${t('codePh')}</div>
      <div class="ph">${t('labelPh')}</div>
      <div class="ph">${t('parentPos')}</div>
      <div class="ph">${t('billability')}</div>
      <div class="ph" style="text-align:center">${t('taggedCol')}</div>
      <div class="ph"></div><div class="ph"></div>
      ${rows}
    </div>
    <p class="phint">${t('posHint')}</p>
    <h3 class="sub-h">${t('addPosition')}</h3>
    <div class="ptable add">
      <span></span>
      <input type="text" id="np-code" placeholder="${t('codePh')}">
      <input type="text" id="np-label" placeholder="${t('labelPh')}">
      <select id="np-parent">
        <option value="">${t('noParent')}</option>
        ${parents.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('')}
      </select>
      <span></span>
      <div class="tagcell">
        <label class="chk" id="np-tagwrap" title="${t('taggedPos')} — ${t('taggedHint')}">
          <input type="checkbox" id="np-tagged"></label>
        <div class="tagfield" id="np-prjwrap" hidden><span>${t('prjTag')}</span>
          <input type="text" class="taginp" id="np-prj" placeholder="${esc(tagNone())}" title="${t('prjTag')}"></div>
      </div>
      <input type="color" id="np-color" value="#5e7ce0">
      <span></span>
    </div>
    <div class="modal-actions" style="justify-content:flex-start">
      <label class="chk"><input type="checkbox" id="p-sharch" ${showArchivedPos?'checked':''}> ${t('showArchived')}</label>
    </div>
    <div class="modal-actions"><button class="btn outline" id="np-add">${t('add')}</button>
      <button class="btn outline" id="pe">${t('exportW')}</button><button class="btn outline" id="pi">${t('importW')}</button>
      <button class="btn primary" id="pc">${t('done')}</button></div>`, 'wide');
  el('p-sharch').onchange=e=>{ showArchivedPos=e.target.checked; openPositions(); };

  el('modal').querySelectorAll('.prow').forEach(row=>{
    const p=posById(row.dataset.p);
    row.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=e=>{
      const f=e.target.dataset.f;
      if(f==='hotkey'){
        const n=e.target.value?+e.target.value:null;
        if(n){ const clash=posByHotkey(n); if(clash&&clash.id!==p.id) clash.hotkey=null; }   // slots are unique
        p.hotkey=n; save(); openPositions(); render(); return;
      }
      if(f==='parentId'){
        const v=e.target.value||null;
        if(v && childrenOf(p.id).length){ toast(t('tHasChildren')); openPositions(); return; }  // no 3rd level
        p.parentId=v;
        if(v){ const par=posById(v); if(par){ p.color=null; par.hotkey=null; } }   // adopt the project's colour
        if(!isBookable(p)) p.hotkey=null;
        ensureHotkeys(); save(); openPositions(); render(); return;
      }
      if(f==='billable'){
        p.billable = e.target.value===''?null : e.target.value==='1';
        save(); openPositions(); render(); return;
      }
      if(f==='tagged'){
        p.tagged=e.target.checked;
        const kids=kidsOf(p.id);
        // Its packages stop being booking codes of their own. Their old code is the best
        // first guess at a Hub, and it lands in the very column it replaces.
        if(p.tagged&&kids.length){
          kids.forEach(k=>{ if(!k.wg&&k.code) k.wg=cleanTag(k.code); });
          toast(t('tTaggedHasKids'));
        }
        save(); openPositions(); render(); return;
      }
      // Grouping and indentation follow the tags, so the table is redrawn on a change.
      if(f==='wg'||f==='prj'){ p[f]=cleanTag(e.target.value); save(); openPositions(); render(); return; }
      p[f]=e.target.value; save(); render();
    });
    const del=row.querySelector('[data-act=del]');
    // Archiving a project takes its work packages with it — otherwise they survive as
    // orphans and keep showing up in every picker.
    if(del) del.onclick=()=>{
      [p,...kidsOf(p.id)].forEach(x=>{ x.archived=true; x.hotkey=null; });
      ensureHotkeys(); save(); openPositions(); render();
    };
    const un=row.querySelector('[data-act=unarch]');
    if(un) un.onclick=()=>{
      p.archived=false;
      const par=projectOf(p); if(par&&par.archived) par.archived=false;   // else it stays invisible
      ensureHotkeys(); save(); openPositions(); render();
    };
    const uc=row.querySelector('[data-act=uncolor]');
    if(uc) uc.onclick=()=>{ p.color=null; save(); openPositions(); render(); };
  });

  // Under a Themenarbeit code the first column is the Hub, not a code — so the add row
  // relabels itself as soon as such a parent is chosen.
  const npSync=()=>{
    const par=posById(el('np-parent').value);
    const tag=isTagged(par);
    el('np-code').placeholder = tag ? t('wgPh') : t('codePh');
    el('np-code').title = tag ? t('wgTag') : '';
    el('np-prjwrap').hidden = !tag;
    el('np-tagwrap').hidden = tag;
  };
  el('np-parent').onchange=npSync; npSync();
  el('np-add').onclick=()=>{
    const code=el('np-code').value.trim(), label=el('np-label').value.trim();
    if(!label){ toast(t('tLabelReq')); return; }
    const parentId=el('np-parent').value||null;
    const par=parentId?posById(parentId):null;
    const color=par?null:el('np-color').value;   // a package inherits its project's colour
    const np={id:uid('p'),code:code||label.toUpperCase().slice(0,8),label,color,
      archived:false,parentId,billable:null};
    if(isTagged(par)){
      const wg=cleanTag(code);
      if(!wg){ toast(t('tPresetNeedsWg')); return; }
      np.code=''; np.wg=wg; np.prj=cleanTag(el('np-prj').value);
    } else if(el('np-tagged').checked){ np.tagged=true; }
    state.positions.push(np);
    if(par) par.hotkey=null;            // a project that gains a package stops being bookable
    ensureHotkeys(); save(); openPositions(); render();
  };
  el('pe').onclick=()=>download('positions.json',JSON.stringify(state.positions,null,2));
  el('pi').onclick=()=>importFile(data=>{ if(Array.isArray(data)){ state.positions=data;
    if(!state.positions.some(p=>p.id==='pause')) state.positions.unshift(defaults().positions[0]);
    ensureHotkeys(); save(); openPositions(); render(); toast(t('tPosImported')); }});
  el('pc').onclick=()=>{ closeModal(); render(); };
}

  el('modal').querySelectorAll('[data-col]').forEach(cb=>cb.onchange=()=>{
    S().exportCols=[...el('modal').querySelectorAll('[data-col]')].filter(x=>x.checked).map(x=>x.dataset.col);
    save();
  });
  el('bk-exp').onclick=()=>download('projector-backup.json',JSON.stringify(state,null,2));
  el('bk-imp').onclick=()=>importFile(data=>{ if(data&&data.blocks&&data.positions){ state=data; lang=S().lang||lang; save(); closeModal(); render(); toast(t('tBackupRestored')); } else toast(t('tNotBackup')); });
  el('bk-close').onclick=closeModal;
}

/* ============================ keyboard labeling flow ============================ */
function selectAndReveal(id){
  selectedId=id; render();
  const n=document.querySelector(`[data-id="${id}"]`);
  if(n&&n.scrollIntoView) n.scrollIntoView({block:'nearest'});
}
function unlabeledBlocks(){ return dayBlocks().filter(b=>!b.positionId); }
// Wraps around, and starts from the current block so repeated `n` walks the whole day.
function gotoNextUnlabeled(){
  const un=unlabeledBlocks();
  if(un.length){
    const bl=dayBlocks(), cur=bl.findIndex(b=>b.id===selectedId);
    const next=un.find(b=>bl.indexOf(b)>cur)
            || (un[0].id!==selectedId ? un[0] : null);   // wrap, unless that means standing still
    if(next){ selectAndReveal(next.id); return true; }
  }
  // Nothing more here — carry on into the days ahead rather than stopping at midnight,
  // since the counts in the week and month rails are what sent you looking to begin with.
  // Without this, a day holding exactly one unlabeled block was a dead end for `n`.
  const hit=findIssue('unlabeled',dayStartMs()+DAY,LOOKAHEAD);
  if(!hit){ toast(t('tNoIssue')); return false; }
  selectedDate=new Date(hit.ms); viewMode='day'; selectAndReveal(hit.id);
  toast(t('tJumpedTo',new Date(hit.ms).toLocaleDateString(loc(),{weekday:'short',day:'numeric',month:'short'})));
  return true;
}
function gotoBlock(dir){
  const bl=dayBlocks(); if(!bl.length) return;
  const i=bl.findIndex(b=>b.id===selectedId);
  const j=i<0 ? (dir>0?0:bl.length-1) : Math.min(bl.length-1,Math.max(0,i+dir));
  selectAndReveal(bl[j].id);
}
function selectedBlock(){                      // only ever the block visible on this day
  return dayBlocks().find(x=>x.id===selectedId)||null;
}
function blockAtMarker(){
  return playhead ? dayBlocks().find(x=>x.start<=playhead && bEnd(x)>playhead)||null : null;
}

/* --- copying a label, not a block ---
   The day is one gapless track, so pasting a block can never be a free insertion: it has to
   displace time that was actually recorded. What repeats across a week is the *label* — the
   same position, wording and tags — not the duration, so `c` and `v` carry that and leave
   every boundary alone. Held in memory only; a reload starts empty. --- */
let clip=null;
function copyLabel(){
  const b=selectedBlock();
  if(!b){ toast(t('tSelectFirst')); return; }
  if(!b.positionId && !(b.description||'').trim()){ toast(t('tNothingToCopy')); return; }
  clip={positionId:b.positionId, description:b.description||'', wg:b.wg, prj:b.prj};
  toast(t('tLabelCopied', clipLabelText()));
}
function pasteLabel(){
  if(!clip){ toast(t('tNothingCopied')); return; }
  const b=blockAtMarker()||selectedBlock();      // the marker wins; the selection is the fallback
  if(!b){ toast(t('tMoveMarker')); return; }
  b.positionId=clip.positionId;
  b.description=clip.description;
  b.wg=clip.wg; b.prj=clip.prj;                  // undefined clears an override, as it should
  selectedId=b.id; save(); render();
  toast(t('tLabelPasted', clipLabelText()));
}
function clipLabelText(){
  if(!clip) return '';
  const p=posById(clip.positionId);
  const d=(clip.description||'').trim();
  return (p?p.label:t('unlabeled'))+(d?' · '+(d.length>28?d.slice(0,27)+'…':d):'');
}
function assignHotkey(n){
  const b=selectedBlock();
  if(!b){ toast(t('tSelectFirst')); return; }
  if(n===0){ b.positionId=null; save(); render(); toast(t('tCleared')); return; }
  const p=posByHotkey(n);
  if(!p){ toast(t('tNoHotkey',n)); return; }
  b.positionId=p.id; save(); render();
  toast(`${n} · ${p.label}`);
}
function focusDesc(){
  const pre=el('ed-desc')?'ed':(el('now-desc')?'now':null);
  if(!pre){ toast(t('tSelectFirst')); return; }
  // On a Themenarbeit block the first *empty* field is the one that wants filling —
  // usually the PEG on a Hub row, and the description everywhere else.
  const i=[pre+'-wg',pre+'-prj',pre+'-desc'].map(el).find(n=>n&&!n.value.trim()) || el(pre+'-desc');
  i.focus(); i.select&&i.select();
}

/* ---- quick-pick overlay: replaces the native <select>, which traps keystrokes ---- */
let qp=null;   // {items, i, filter}
function openQuickPick(){
  const b=selectedBlock();
  if(!b){ toast(t('tSelectFirst')); return; }
  qp={items:pickerPositions(),i:0,filter:''};
  const cur=qp.items.findIndex(p=>p.id===b.positionId);
  if(cur>=0) qp.i=cur;
  openModal(`<h2>${t('position')}</h2>
    <input type="text" id="qp-filter" placeholder="${t('qpFilter')}" autocomplete="off">
    <div class="qp-list" id="qp-list"></div>
    <p class="hint" style="margin:8px 0 0">${t('qpHint')}</p>`);
  const inp=el('qp-filter');
  inp.oninput=()=>{ qp.filter=inp.value.toLowerCase(); qp.i=0; paintQuickPick(); };
  inp.onkeydown=e=>{
    const vis=qpVisible();
    if(e.key==='ArrowDown'){ e.preventDefault(); qp.i=Math.min(vis.length-1,qp.i+1); paintQuickPick(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); qp.i=Math.max(0,qp.i-1); paintQuickPick(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(vis[qp.i]) pickQuickPick(vis[qp.i].id); }
    else if(e.key==='Escape'){ e.preventDefault(); closeModal(); }
    else if(/^[1-9]$/.test(e.key) && !qp.filter){ e.preventDefault();
      const p=posByHotkey(+e.key); if(p) pickQuickPick(p.id); }
  };
  paintQuickPick(); inp.focus();
}
function qpVisible(){
  if(!qp) return [];
  const f=qp.filter;
  return qp.items.filter(p=>!f || pathLabel(p).toLowerCase().includes(f) || (p.code||'').toLowerCase().includes(f));
}
function paintQuickPick(){
  const list=el('qp-list'); if(!list||!qp) return;
  const vis=qpVisible();
  if(qp.i>=vis.length) qp.i=Math.max(0,vis.length-1);
  list.innerHTML=vis.map((p,i)=>`
    <div class="qp-item${i===qp.i?' cur':''}" data-pick="${p.id}">
      <span class="sw" style="background:${posColor(p)}"></span>
      <span class="qp-lab">${splitLabelHtml(p)}</span>
      <span class="qp-code">${esc(p.code||'')}</span>
      ${p.hotkey?`<kbd>${p.hotkey}</kbd>`:''}
    </div>`).join('')||`<p class="dim" style="margin:8px 0">—</p>`;
  list.querySelectorAll('[data-pick]').forEach(n=>n.onclick=()=>pickQuickPick(n.dataset.pick));
  const cur=list.querySelector('.qp-item.cur'); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}
function pickQuickPick(id){
  const b=selectedBlock();
  if(b){ b.positionId=id; save(); }
  qp=null; closeModal(); render();
  const p=posById(id); if(p) toast(p.label);
}

/* ============================ week view ============================ */
function weekStats(ws){
  const days=[];
  for(let i=0;i<7;i++){
    const d=addDays(ws,i), dm=d.getTime(), bl=blocksOfDay(dm);
    days.push(Object.assign({date:d, ms:dm, compl:complianceOf(bl)}, statsFor(bl)));
  }
  const tot=sumStats(days);
  return {days, per:tot.per, work:tot.work, pause:tot.pause,
          unlabeledCount:tot.unlabeled, noWgCount:tot.noWg};
}
function renderWeek(){
  const ws=startOfWeek(selectedDate), st=weekStats(ws), wv=el('weekview');
  const WPPM=0.8;
  // shared time window across the week
  let minM=S().dayStartHour*60, maxM=S().dayEndHour*60;
  st.days.forEach(d=>blocksOfDay(d.ms).forEach(b=>{
    minM=Math.min(minM,(b.start-d.ms)/60000); maxM=Math.max(maxM,(bEnd(b)-d.ms)/60000);
  }));
  minM=Math.max(0,Math.floor(minM/60)*60); maxM=Math.min(24*60,Math.ceil(maxM/60)*60);
  if(maxM<=minM) maxM=minM+60;
  const H=(maxM-minM)*WPPM, todayMs=todayMid();
  const names=t('dayNames');
  let head=`<div class="wk-head"><div></div>`+st.days.map((d,i)=>{
    const ty=dayType(d.ms);
    return `<div class="wk-dh${d.ms===todayMs?' today':''}${[0,6].includes(d.date.getDay())?' we':''}${ty?' off':''}" data-day="${d.ms}">
       <div class="wk-dn">${names[i]}</div>
       <div class="wk-dt">${pad(d.date.getDate())}.${pad(d.date.getMonth()+1)}.</div>
       <div class="wk-dt" style="margin-top:2px">${d.work?fmtDur(d.work):'–'}</div>
       <div class="wk-badge">${dtBadge(ty,false,isHalfDay(d.ms))}</div>
     </div>`;}).join('')+`</div>`;
  let gut=`<div class="wk-gut">`;
  for(let hr=Math.ceil(minM/60); hr<=Math.floor(maxM/60); hr++)
    gut+=`<div class="wk-hl" style="top:${(hr*60-minM)*WPPM}px">${pad(hr)}:00</div>`;
  gut+=`</div>`;
  const lines=`repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px ${60*WPPM}px)`;
  let cols=st.days.map(d=>{
    const bl=blocksOfDay(d.ms);
    const inner=bl.map(b=>{
      const top=((b.start-d.ms)/60000-minM)*WPPM;
      const ht=Math.max(9,((bEnd(b)-b.start)/60000)*WPPM);
      const p=posById(b.positionId);
      return `<div class="wk-blk${p?'':' un'}" style="top:${top}px;height:${ht}px;${p?`background:${posColor(p)};`:''}"
        title="${esc((p?p.label:t('unlabeled'))+' · '+fmtHM(b.start)+'–'+fmtHM(bEnd(b)))}">${ht>18?esc(p?p.label:t('unlabeled')):''}</div>`;
    }).join('');
    // The column paints its hour rules with background-image, so a flagged day appends its
    // hatch to that list instead of replacing it.
    const hatch='repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(244,186,64,.10) 7px,rgba(244,186,64,.10) 14px)';
    return `<div class="wk-col${d.ms===todayMs?' today':''}${[0,6].includes(d.date.getDay())?' we':''}" data-day="${d.ms}" style="height:${H}px;background-image:${dayFlagged(d)?hatch+','+lines:lines}">${inner}</div>`;
  }).join('');
  wv.innerHTML=head+`<div class="wk-grid" style="height:${H}px">${gut}${cols}</div>
    <p class="hint wk-hint">${t('clickDayHint')}</p>`;
  wv.querySelectorAll('[data-day]').forEach(n=>n.onclick=()=>{
    selectedDate=new Date(+n.dataset.day); viewMode='day'; selectedId=null; render();
  });
  renderWeekRail(ws,st);
}
function renderWeekRail(ws,st){

  const target=weekTargetMs(ws);                       // reduced by holidays / leave in this week
  const off=st.days.reduce((n,d)=>n+dayOff(d.ms),0);   // fractional: a half day counts ½
  const diff=st.work-target, over=diff>=0;
  // summary
  el('now-card').innerHTML=`<h3>${t('week')} ${isoWeekNo(ws)}</h3>
    <div class="dim tabnum" style="margin-bottom:8px">${t('wkRange',fmtD(ws),fmtD(we))}</div>
    <div class="elapsed tabnum">${fmtDur(st.work)}</div>
    <div class="dim tabnum">${t('weekTotal')} / ${fmtDur(target)} ·

    ${off?`<div class="dim" style="font-size:11.5px;margin-top:2px">${t('targetReduced',fmtDays(off))}</div>`:''}
    <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,target?st.work/target*100:0)}%;background:var(--accent-bright)"></i></div>
    <div class="tline" style="margin-top:10px"><span class="dim">${t('breakRow')}</span><span class="tabnum dim">${fmtDur(st.pause)}</span></div>

    ${st.unlabeledCount?issueBtn('unlabeled',ws.getTime(),7,t('weekUnlabeled',st.unlabeledCount)):''}
    ${st.noWgCount?issueBtn('noWg',ws.getTime(),7,t('noWgWarn',st.noWgCount)):''}
    ${st.days.some(d=>d.compl.viol)?issueBtn('break',ws.getTime(),7,t('warnBreak')):''}`;
  // by position — work packages rolled up into their project
  el('editor-card').hidden=false;
  el('editor-card').innerHTML=`<h3>${t('byPosition')}</h3>`+positionBreakdownHtml(st.per,st.work,t('noDataWeek'));
  // per day
  const maxDay=Math.max(...st.days.map(d=>d.work+d.pause),1);
  const names=t('dayNames');
  el('totals-card').innerHTML=`<h3>${t('perDay')}</h3>`+st.days.map((d,i)=>{
    const tot=d.work+d.pause;
    // The tooltip carries the exact figures for a mouse; the legend below carries the
    // meaning of the two colours for everything else, touch included.
    const tip=`${names[i]} — ${t('work')} ${fmtDur(d.work)} · ${t('breakRow')} ${fmtDur(d.pause)}`;
    return `<div class="dayrow${tot?'':' zero'}" title="${esc(tip)}">
      <span class="dim">${names[i]}</span>
      <span class="dbar">
        <i style="width:${d.work/maxDay*100}%;background:var(--accent-bright)"></i>
        <i style="width:${d.pause/maxDay*100}%;background:var(--break)"></i>
      </span>
      <span class="tabnum">${d.work?fmtDur(d.work):'–'}${dayFlagsHtml(d)}</span>
    </div>`;
  }).join('')+barLegendHtml();
}
// Legend for the work/break bars. Permanent rather than hover-only: the app installs to an
// iPhone home screen, where there is no hover to reveal anything.
function barLegendHtml(){
  return `<div class="splitleg" style="margin-top:8px">
      <span><i style="background:var(--accent-bright)"></i>${t('work')}</span>
      <span><i style="background:var(--break)"></i>${t('breakRow')}</span>
    </div>`;
}
// Shared by the week and month rails: work packages rolled up into their project.
function positionBreakdownHtml(per,totalWork,emptyMsg){
  const groups={};
  Object.entries(per).filter(([k])=>k!=='__un'&&k!==PAUSE()).forEach(([k,v])=>{
    const p=posById(k); if(!p) return;
    const r=rootOf(p);
    const g=groups[r.id]=groups[r.id]||{pos:r,total:0,kids:[]};
    g.total+=v;
    if(r.id!==p.id) g.kids.push([p,v]);
  });
  const rows=Object.values(groups).sort((a,b)=>b.total-a.total);
  const tw=totalWork||1;
  if(!rows.length) return `<p class="dim" style="margin:0">${emptyMsg}</p>`;
  return rows.map(g=>{
    const kids=g.kids.sort((a,b)=>b[1]-a[1]).map(([p,v])=>
      `<div class="stat-top" style="font-size:11.5px;color:var(--dim);padding-left:12px">
         <span>${esc(p.label)}</span><span class="tabnum">${fmtDur(v)}</span></div>`).join('');
    return `<div class="stat">
      <div class="stat-top"><span>${esc(g.pos.label)}<span class="pct">${Math.round(g.total/tw*100)}%</span></span><span class="tabnum">${fmtDur(g.total)}</span></div>
      <div class="bar"><i style="width:${g.total/tw*100}%;background:${posColor(g.pos)}"></i></div>
      ${kids}
    </div>`;
  }).join('');
}

/* ============================ month view ============================ */
function monthStats(anchor){
  const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);
  const last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);
  const days=[];
  let target=0, expected=0, weekdays=0, missing=0, viol=0;
  const leave={holiday:0,vacation:0,sick:0};
  for(let i=1;i<=last.getDate();i++){
    const d=new Date(anchor.getFullYear(),anchor.getMonth(),i), dm=d.getTime();
    const bl=blocksOfDay(dm);
    const ty=dayType(dm), compl=complianceOf(bl);
    if(ty) leave[ty]+=dayOff(dm);       // half a day off is half a day of leave
    if(isWeekday(dm)) weekdays++;
    if(isExpected(dm)){ expected++; if(!bl.length) missing++; }
    if(compl.viol) viol++;
    target+=dayTargetMs(dm);
    days.push(Object.assign({date:d, ms:dm, type:ty, compl, bill:splitBillable(bl)}, statsFor(bl)));
  }
  const tot=sumStats(days);
  return {first,last,days,per:tot.per,work:tot.work,pause:tot.pause,
          unlabeledCount:tot.unlabeled,noWgCount:tot.noWg,
          target,expected,weekdays,missing,viol,leave};
}
function renderMonth(){
  const st=monthStats(selectedDate), mv=el('monthview');
  const names=t('dayNames'), todayMs=todayMid();
  const gridStart=startOfWeek(st.first);
  const cells=[];
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i), dm=d.getTime();
    if(i>=35 && dm>st.last.getTime()) break;             // 6th row only when the month needs it
    const inMonth=d.getMonth()===st.first.getMonth();
    const s=st.days.find(x=>x.ms===dm);
    const bw=s?s.bill.fact+s.bill.intern:0;
    const flagged=inMonth&&dayFlagged(s);
    cells.push(`<div class="mo-cell${inMonth?'':' out'}${dm===todayMs?' today':''}${[0,6].includes(d.getDay())?' we':''}${flagged?' flagged':''}"
         data-day="${dm}" title="${esc(d.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'}))}">
      <div class="mo-top">
        <span class="mo-date">${d.getDate()}</span>
        ${s&&s.type?dtBadge(s.type,false,isHalfDay(dm)):''}
      </div>
      <div class="mo-h tabnum">${s&&s.work?fmtDur(s.work):(inMonth?'<span class="dim">–</span>':'')}</div>
      ${bw?`<div class="mo-split"><i style="width:${s.bill.fact/bw*100}%;background:var(--accent-bright)"></i><i style="width:${s.bill.intern/bw*100}%;background:var(--intern)"></i></div>`:''}
      <div class="mo-flags">${dayFlagsHtml(s)}</div>
    </div>`);
  }
  mv.innerHTML=`<div class="mo-head">${names.map(n=>`<div>${n}</div>`).join('')}</div>
    <div class="mo-grid">${cells.join('')}</div>
    <p class="hint" style="margin:10px 0 0">${t('clickDayHint')}</p>`;
  mv.querySelectorAll('[data-day]').forEach(n=>n.onclick=()=>{
    selectedDate=new Date(+n.dataset.day); viewMode='day'; selectedId=null; render();
  });
  renderMonthRail(st);
}

    <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,st.target?st.work/st.target*100:0)}%;background:var(--accent-bright)"></i></div>
    <div class="tline" style="margin-top:10px"><span class="dim">${t('breakRow')}</span><span class="tabnum dim">${fmtDur(st.pause)}</span></div>

  // by position
  el('editor-card').hidden=false;
  el('editor-card').innerHTML=`<h3>${t('byPosition')}</h3>`+positionBreakdownHtml(st.per,st.work,t('noDataMonth'));
  // per week + completeness
  const weeks=[];
  st.days.forEach(d=>{
    const ws=startOfWeek(d.date).getTime();
    let w=weeks.find(x=>x.ws===ws);
    if(!w) weeks.push(w={ws,no:isoWeekNo(d.date),work:0,pause:0});
    w.work+=d.work; w.pause+=d.pause;
  });
  const maxW=Math.max(...weeks.map(w=>w.work+w.pause),1);
  const m0=st.first.getTime(), span=st.days.length;
  const issues=[];
  if(st.missing) issues.push(issueBtn('missing',m0,span,t('missingDays',st.missing)));
  if(st.unlabeledCount) issues.push(issueBtn('unlabeled',m0,span,t('monthUnlabeled',st.unlabeledCount)));
  if(st.noWgCount) issues.push(issueBtn('noWg',m0,span,t('noWgWarn',st.noWgCount)));
  if(st.viol) issues.push(issueBtn('break',m0,span,t('breakViol',st.viol)));
  el('totals-card').innerHTML=`<h3>${t('perWeek')}</h3>`+weeks.map(w=>{
    const tip=`${t('week')} ${w.no} — ${t('work')} ${fmtDur(w.work)} · ${t('breakRow')} ${fmtDur(w.pause)}`;
    return `<div class="dayrow${w.work+w.pause?'':' zero'}" title="${esc(tip)}">
      <span class="dim">${t('week')} ${w.no}</span>
      <span class="dbar">
        <i style="width:${w.work/maxW*100}%;background:var(--accent-bright)"></i>
        <i style="width:${w.pause/maxW*100}%;background:var(--break)"></i>
      </span>
      <span class="tabnum">${w.work?fmtDur(w.work):'–'}</span>
    </div>`;
  }).join('')+barLegendHtml()
   +`<h3 style="margin-top:16px">${t('completeness')}</h3>`
   +(issues.length?issues.join(''):`<div class="compl ok">${t('allComplete')}</div>`);
}

/* ============================ Projectile export ============================ */
// Merge consecutive same-position blocks into one row. This is the main lever for
// reducing hand-entered cells: a day of many small blocks collapses to a few rows.
function mergedRows(blocks){
  const out=[];
  const merge=S().mergeRows!==false;   // off → one row per block, as tracked
  blocks.filter(b=>b.end!=null).forEach(b=>{
    const last=out[out.length-1];
    const d=(b.description||'').trim();
    // A row states its tags once, so blocks may only merge when both tags agree —
    // otherwise the row would claim a Hub that half of it was not booked under.
    const tag=isTaggedBlock(b), wg=tag?effTag(b,'wg'):'', prj=tag?effTag(b,'prj'):'';
    if(merge && last && last.positionId===b.positionId && last.wg===wg && last.prj===prj
       && Math.abs(last.end-b.start)<1000){
      last.end=b.end;
      if(d && !last.descs.includes(d)) last.descs.push(d);
    } else {
      out.push({start:b.start,end:b.end,positionId:b.positionId,tagged:tag,wg,prj,descs:d?[d]:[]});
    }
  });
  return out;
}
function fmtDate(ms){
  const d=new Date(ms), dd=pad(d.getDate()), mm=pad(d.getMonth()+1), yy=d.getFullYear();
  return S().dateFmt==='yyyy-mm-dd' ? `${yy}-${mm}-${dd}` : `${dd}.${mm}.${yy}`;
}
function fmtDurExport(ms){
  if(S().durFmt==='dec'){ const v=(ms/3600000).toFixed(2); return lang==='de'?v.replace('.',','):v; }
  return fmtDur(ms);
}
const XCOLS={
  date: {t:'colDate',  v:r=>fmtDate(r.start)},
  start:{t:'colStart', v:r=>fmtHM(r.start)},
  end:  {t:'colEnd',   v:r=>fmtHM(r.end)},
  dur:  {t:'colDur',   v:r=>fmtDurExport(r.end-r.start)},
  // A Hub / PEG row is not a code of its own: both columns resolve to the booking code it
  // hangs under, so a Themenarbeit row books on the Themenarbeit code and says so.
  proj: {t:'colProject',v:r=>{ const pr=projectOf(bookingCodeOf(posById(r.positionId))); return pr?(pr.code||pr.label):''; }},
  pos:  {t:'colPos',   v:r=>{ const p=bookingCodeOf(posById(r.positionId)); return p?(p.code||p.label):''; }},
  desc: {t:'colDesc',  v:r=>r.tagged?tagParts(r.wg,r.prj,joinDescs(r.descs)):joinDescs(r.descs)}
};
// Projectile instances differ in what they accept between merged descriptions, so the
// separator is a setting. Stored verbatim; spaces around it are the user's choice.
function descSep(){ const s=S().descSep; return s==null?'; ':s; }
// Descriptions are written as sentences ending in a period. Strung together with a
// separator those periods double up ("a.; b."), so every part but the last drops its
// trailing full stop and the sentence still closes at the end of the cell.
// A trailing space in a text field is invisible, and this setting depends on one — so the
// preview spells the separator out with a middot standing in for each space.
function showWs(s){ return String(s).replace(/ /g,'␣'); }
function stripEndPeriod(s){ return String(s).replace(/\s*\.\s*$/,''); }
function joinDescs(descs){
  if(!descs.length) return '';
  return descs.map((d,i)=> i===descs.length-1 ? d : stripEndPeriod(d)).join(descSep());
}
function activeCols(){ const c=S().exportCols||[]; return Object.keys(XCOLS).filter(k=>c.includes(k)); }

let xstate=null;   // {cells:[{r,c,val}], i}

function openExport(){
  const blocks=dayBlocks().filter(b=>b.end!=null);
  if(!blocks.length){ toast(t('tNothingExport')); return; }
  if(blocks.some(b=>!b.positionId)){
    openModal(`<h2>${t('projExport')}</h2>
      <div class="compl warn" style="margin:0 0 14px">${t('blockedUnlabeled')}</div>
      <div class="modal-actions"><button class="btn primary" id="x-close">${t('close')}</button></div>`);
    el('x-close').onclick=closeModal; return;
  }
  const rows=mergedRows(blocks), cols=activeCols();
  const cells=[];
  rows.forEach((r,ri)=>cols.forEach((c,ci)=>cells.push({r:ri,c:ci,val:XCOLS[c].v(r)})));
  xstate={cells,i:0};
  const cs=complianceOf(blocks);
  const nw=untaggedBlocks(blocks).length;
  const warn=(cs.viol?`<div class="compl warn" style="margin:0 0 10px">${t('warnBreak')}</div>`:'')
           +(nw?`<div class="compl warn" style="margin:0 0 10px">${t('noWgWarn',nw)}</div>`:'');
  openModal(`<h2>${t('projExport')}</h2>${warn}
    <div class="xbar"><span>${t('rowsCells',rows.length,cells.length)}</span>
      <label class="chk"><input type="checkbox" id="x-merge" ${S().mergeRows!==false?'checked':''}> ${t('mergeRows')}</label>
      <span class="prog" id="x-prog"></span></div>
    <div class="xwrap"><table class="xt">
      <thead><tr>${cols.map(c=>`<th>${t(XCOLS[c].t)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r,ri)=>`<tr>${cols.map((c,ci)=>{
        const idx=ri*cols.length+ci;
        return `<td><div class="xc" data-x="${idx}">${esc(XCOLS[c].v(r))||'&nbsp;'}</div></td>`;
      }).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <p class="hint" style="margin:0 0 12px">${t('exportHint')}</p>
    <div class="modal-actions" style="justify-content:flex-start">
      <button class="btn outline" id="x-row">${t('copyRow')}</button>
      <button class="btn outline" id="x-all">${t('copyAll')}</button>
      <button class="btn outline" id="x-reset">${t('reset')}</button>
    </div>
    <div class="modal-actions"><button class="btn primary" id="x-close">${t('close')}</button></div>`);
  el('modal').querySelectorAll('.xc').forEach(d=>d.onclick=()=>{ xstate.i=+d.dataset.x; copyCurrent(); });
  // Flipping it here writes the setting — the decision is usually made looking at the table.
  el('x-merge').onchange=e=>{ S().mergeRows=e.target.checked; save(); openExport(); };
  el('x-row').onclick=()=>{ const ri=Math.floor(xstate.i/cols.length);
    copyText(cols.map((c,ci)=>cells[ri*cols.length+ci].val).join('\t')).then(()=>toast(t('tRowCopied'))); };
  el('x-all').onclick=()=>{ copyText(rows.map(r=>cols.map(c=>XCOLS[c].v(r)).join('\t')).join('\n')).then(()=>toast(t('tAllCopied'))); };
  el('x-reset').onclick=()=>{ xstate.i=0; paintExport(); };
  el('x-close').onclick=closeModal;
  paintExport();
}
function paintExport(){
  if(!xstate) return;
  const p=el('x-prog'); if(p) p.textContent=t('cellProgress',Math.min(xstate.i+1,xstate.cells.length),xstate.cells.length);
  el('modal').querySelectorAll('.xc').forEach(d=>{
    const i=+d.dataset.x;
    d.classList.toggle('cur',i===xstate.i);
    d.classList.toggle('done',i<xstate.i);
  });
  const cur=el('modal').querySelector('.xc.cur'); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}
function copyCurrent(){
  if(!xstate) return;
  const cell=xstate.cells[xstate.i]; if(!cell) return;
  const advance=()=>{
    if(xstate.i<xstate.cells.length-1){ xstate.i++; paintExport(); }
    else { toast(t('tExportDone')); paintExport(); }
  };
  if(!cell.val){ toast(t('tEmptyCell')); advance(); return; }   // nothing to paste — just move on
  copyText(cell.val).then(ok=>{
    if(!ok){ toast(t('tCopyFail')); return; }                   // never advance on a failed copy
    toast(t('tCopied',cell.val));
    advance();
  });
}
function copyText(s){
  return new Promise(res=>{
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(s).then(()=>res(true)).catch(()=>res(fallbackCopy(s)));
    } else res(fallbackCopy(s));
  });
}
function fallbackCopy(s){
  const ta=document.createElement('textarea'); ta.value=s;
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); return ok;
}

/* ============================ calendar (ICS) export ============================ */
function dtICS(ms){ const d=new Date(ms); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
function exportICS(){
  const blocks=dayBlocks().filter(b=>b.end!=null);
  if(!blocks.length){ toast(t('tNothingExport')); return; }
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Projector//EN\r\nCALSCALE:GREGORIAN\r\n';
  blocks.forEach(b=>{
    const p=posById(b.positionId); const d=composedDesc(b);
    const sum=(p?p.label:t('unlabeled'))+(d?' · '+d:'');
    ics+='BEGIN:VEVENT\r\n'+`UID:${b.id}@projector\r\n`+`DTSTART:${dtICS(b.start)}\r\n`+`DTEND:${dtICS(b.end)}\r\n`+`SUMMARY:${sum.replace(/[\r\n]/g,' ')}\r\n`+'END:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const name='projector-'+new Date(dayStartMs()).toISOString().slice(0,10)+'.ics';
  download(name,ics,'text/calendar');
  toast(t('tCalExported',new Date(dayStartMs()).toLocaleDateString(loc(),{weekday:'short',day:'2-digit',month:'short'})));
}

/* ============================ modal & file utils ============================ */
function openModal(html,cls){ const m=el('modal'); m.className='modal'+(cls?' '+cls:''); m.innerHTML=html; el('overlay').style.display='flex'; }
function closeModal(){ el('overlay').style.display='none'; xstate=null; qp=null; }
el('overlay').addEventListener('mousedown',e=>{ if(e.target===el('overlay')) closeModal(); });
function download(name,text,type='application/json'){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function importFile(cb){
  const inp=el('file-in'); inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ cb(JSON.parse(r.result)); }catch(e){ toast(t('tInvalidJson')); } inp.value=''; }; r.readAsText(f); }; inp.click();
}
let toastT; function toast(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============================ demo data ============================ */
// A filled-in three weeks for `?demo`: one Themenarbeit code with a full Hub/PEG tree, a
// Themenarbeit code without sub-positions (tags typed by hand), two ordinary factura
// projects, and the awkward cases worth seeing — a per-block PEG override, a missing Hub,
// an unlabeled block, a late break, and the three kinds of day off.
function demoData(){
  const d=defaults();
  d.positions=[
    {id:'pause',code:'PAUSE',label:'Pause',color:'#d49a4a',archived:false,reserved:true,parentId:null,billable:false,hotkey:9},
    // Themenarbeit: its sub-positions are Hub and PEG rows, not codes. All book on THEMA.
    {id:'int', code:'THEMA',label:'Themenarbeit',color:'#6b7a8f',archived:false,parentId:null,billable:false,tagged:true},
    {id:'wgd', code:'',label:'Hub Datenanalyse',color:null,archived:false,parentId:'int',billable:null,wg:'HUB-DAT',hotkey:1},
    {id:'wgd1',code:'',label:'Studie Nord',     color:null,archived:false,parentId:'int',billable:null,wg:'HUB-DAT',prj:'PEG-2451',hotkey:2},
    {id:'wgd2',code:'',label:'Kohorte Süd',     color:null,archived:false,parentId:'int',billable:null,wg:'HUB-DAT',prj:'PEG-2610',hotkey:3},
    {id:'wgm', code:'',label:'Hub Modellierung',color:null,archived:false,parentId:'int',billable:null,wg:'HUB-MOD',hotkey:4},
    {id:'wgm1',code:'',label:'Prognosetool',    color:null,archived:false,parentId:'int',billable:null,wg:'HUB-MOD',prj:'PEG-3120',hotkey:5},
    {id:'wgg', code:'',label:'Hub Gremien',     color:null,archived:false,parentId:'int',billable:null,wg:'HUB-GRE',hotkey:6},
    // Themenarbeit as well, but with no sub-positions: both tags are typed on the block.
    {id:'snd', code:'QUER',label:'Querschnittsaufgaben',color:'#8a6fae',archived:false,parentId:null,billable:false,tagged:true},
    {id:'ka',  code:'PRJ-A',label:'Kunde Alpha',color:'#5e7ce0',archived:false,parentId:null,billable:true},
    {id:'ka1', code:'PRJ-A-DEV', label:'Entwicklung',color:null,     archived:false,parentId:'ka',billable:null,hotkey:7},
    {id:'ka2', code:'PRJ-A-MEET',label:'Meetings',   color:'#7b93e8',archived:false,parentId:'ka',billable:null,hotkey:8},
    {id:'kb',  code:'PRJ-B',label:'Kunde Beta',color:'#4fa3a1',archived:false,parentId:null,billable:true},
    // No hotkey left over — reachable through the quick-pick, which is the point.
    {id:'kb1', code:'PRJ-B-INT', label:'Integration',color:null,archived:false,parentId:'kb',billable:null}
  ];

  let n=0;
  const blocks=[], at=(day,hm)=>day+(hm[0]*60+hm[1])*60000;
  // [from, to, positionId, description, {wg,prj} override]
  const scripts=[
    [[[8,30],[10,0], 'wgd1','Rohdaten aus dem Register aufbereitet.'],
     [[10,0],[11,45],'wgd1','Auswertung der Basisvariablen.'],
     [[11,45],[12,30],'pause'],
     [[12,30],[14,0],'ka1','Importer für die Schnittstelle gebaut.'],
     [[14,0],[15,0], 'ka2','Abstimmung mit dem Fachbereich.'],
     // same Hub row, different PEG — booked through a per-block override
     [[15,0],[17,0], 'wgd','Kohortenabgleich vorbereitet.',{prj:'PEG-2610'}]],

    [[[9,0],[10,30], 'wgm1','Featureauswahl überarbeitet.'],
     [[10,30],[12,0],'wgm', 'Modellvergleich dokumentiert.'],
     [[12,0],[12,45],'pause'],
     [[12,45],[14,30],'kb1','Testfälle für die Übergabe geschrieben.'],
     [[14,30],[16,0], 'wgg','Sitzung des Hubs protokolliert.'],
     [[16,0],[17,15], 'wgd2','Fragebogen kodiert.']],

    [[[8,45],[10,15],'ka1','Parser für die Altdaten gefixt.'],
     [[10,15],[11,0],'ka2','Daily und Planung.'],
     [[11,0],[12,30],'wgd1','Zwischenbericht geschrieben.'],
     [[12,30],[13,15],'pause'],
     // a Themenarbeit code without sub-positions: both tags live on the block itself
     [[13,15],[15,0],'snd','Konzept für die Erhebung entworfen.',{wg:'HUB-DAT',prj:'PEG-9001'}],
     [[15,0],[16,45],'wgm1','Prognoseläufe kalibriert.']],

    [[[9,0],[11,0],  'wgd2','Plausibilitätsprüfung der Kohorte.'],
     [[11,0],[12,0], 'wgg', 'Vorbereitung der Gremienvorlage.'],
     [[12,0],[12,30],'pause'],
     [[12,30],[14,0],'ka1','Review und Nacharbeiten.'],
     // no Hub at all — this is what the warning is for
     [[14,0],[15,30],'snd','Nacherfassung ohne Zuordnung.'],
     [[15,30],[17,0],'wgm','Zwischenstand im Hub besprochen.']],

    [[[8,30],[10,0], 'wgd1','Skript für den Datenabzug angepasst.'],
     // the late break: nothing taken before the 6 h mark
     [[10,0],[12,0], 'ka1','Migration der Konfiguration.'],
     [[12,0],[14,0], 'ka1','Fehlersuche im Deployment.'],
     [[14,0],[15,0], 'wgm1','Auswertung der Läufe.'],
     [[15,0],[15,45],'pause'],
     [[15,45],[17,0],'wgd','Notizen sortiert.',{prj:'PEG-2451'}]],

    [[[9,0],[10,30], 'wgd1','Abgleich mit dem Register.'],
     [[10,30],[12,0],null,''],                       // unlabeled — blocks the export
     [[12,0],[12,30],'pause'],
     [[12,30],[15,0],'kb1','Schnittstelle gegen die Testumgebung gefahren.'],
     [[15,0],[16,30],'wgg','Protokoll finalisiert.']]
  ];

  // Walk back over the last three weeks of weekdays; today only up to the current time.
  const mid=todayMid(), nowMs=Date.now();
  const days=[];
  for(let i=20;i>=0;i--){
    const dm=mid-i*DAY;
    if(isWeekday(dm)) days.push(dm);
  }
  days.forEach((dm,i)=>{
    // ...including one half day, so the fractional target has something to show.
    const off={4:{t:'vacation',f:0.5},9:'sick',12:'holiday'}[i];
    if(off){ d.dayTypes[isoDate(dm)]=off; return; }           // a day off stays empty
    scripts[i%scripts.length].forEach(([from,to,pos,desc,tags])=>{
      const start=at(dm,from), end=at(dm,to);
      if(start>=nowMs) return;                                 // never track into the future
      const b={id:'demo'+(++n),start,end:Math.min(end,nowMs),positionId:pos||null,description:desc||''};
      if(tags&&tags.wg) b.wg=tags.wg;
      if(tags&&tags.prj) b.prj=tags.prj;
      blocks.push(b);
    });
  });
  d.blocks=blocks;
  return d;
}

/* ============================ overnight safety net ============================ */
function checkStale(){
  const r=runningBlock(); if(!r)return;
  const hrs=(now()-r.start)/3600000;
  if(hrs>=S().staleHours){
    openModal(`<h2>${t('stillRunning')}</h2>
      <p>${t('staleText', new Date(r.start).toLocaleDateString(loc())+' '+fmtHM(r.start), hrs.toFixed(1))}</p>
      <div class="field"><label>${t('endItAt')}</label><input type="text" id="st-time" inputmode="numeric" placeholder="HH:MM" value="${fmtHM(now())}"></div>
      <div class="modal-actions">
        <button class="btn outline" id="st-keep">${t('keepRunning')}</button>
        <button class="btn primary" id="st-stop">${t('stopIt')}</button>
      </div>`);
    el('st-keep').onclick=closeModal;
    el('st-stop').onclick=()=>{ const v=parseHMok(el('st-time').value); let end=v!=null?v:now(); if(end<=r.start) end=now(); r.end=end; save(); closeModal(); render(); };
  }
}
