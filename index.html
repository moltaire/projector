<style>
  :root{
    --bg:#1c1b22; --card:#2b2a32; --card2:#27262e; --line:#3a3942;
    --text:#e5e5e5; --dim:#7c7884;
    --accent:#757c58; --accent-bright:#a8b86a; --accent-hover:#bccf7a; --on-accent:#1c1b22;
    --intern:#6a9fb5;
    --focus:#CE3F32; --break:#F4BA40; --rest:#2A62B6;
    --radius:12px; --radius-sm:8px; --t:.15s;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:14px; display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .tabnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer; color:var(--text)}
  /* ---- header ---- */
  header{
    display:flex; align-items:center; gap:18px; padding:12px 18px;
    border-bottom:1px solid var(--line); flex:0 0 auto; flex-wrap:wrap; row-gap:8px;
  }
  /* Installed to an iOS home screen the status bar is translucent and the page runs under
     the notch, so the header keeps clear of it. Zero in a normal browser tab. */
  @supports (padding:env(safe-area-inset-top)){
    header{padding-top:calc(12px + env(safe-area-inset-top));
           padding-left:calc(18px + env(safe-area-inset-left));
           padding-right:calc(18px + env(safe-area-inset-right))}
    #rail,#timeline-wrap{padding-bottom:env(safe-area-inset-bottom)}
  }
  .brand{font-weight:600; letter-spacing:-.2px; font-size:15px}
  /* Loud on purpose: the demo store looks exactly like a real one from the timeline. */
  .demo-badge{margin-left:7px; font-family:inherit; font-size:9.5px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--on-accent);
    background:var(--accent-bright); border:none; border-radius:999px; padding:2px 7px;
    cursor:pointer; vertical-align:1px}
  .datenav{display:flex; align-items:center; gap:6px}
  .datenav .date{min-width:150px; text-align:center; font-weight:500}
  .toolbar{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .tb-sep{width:1px; height:19px; background:var(--line); flex:0 0 auto}
  .btn{
    background:none; border:1px solid transparent; color:var(--dim);
    padding:7px 11px; border-radius:var(--radius-sm); transition:color var(--t),border-color var(--t),background var(--t);
    font-size:13px;
  }
  .btn:hover{color:var(--text)}
  .btn.outline{border-color:var(--line)}
  .btn.outline:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent-bright); color:var(--on-accent); border-color:var(--accent-bright); font-weight:600}
  /* Greyed rather than hidden: the toolbar keeps its shape across view switches, and a
     disabled button with a reason in its tooltip teaches the rule. */
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn.outline:disabled:hover{border-color:var(--line); color:var(--dim)}
  .btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
  .btn.on{color:var(--on-accent); background:var(--accent-bright); border-color:var(--accent-bright)}
  .btn.soon{color:var(--dim); border:1px dashed var(--line); cursor:default}
  .btn:disabled{opacity:.7}
  .btn.icon{padding:7px 9px}
  /* ---- main ---- */
  /* minmax(0,…) stops wide content from blowing the grid out and scrolling the page */
  main{flex:1 1 auto; display:grid; grid-template-columns:minmax(0,1fr) 340px; min-height:0}
  #timeline-wrap{overflow:auto; position:relative; padding:0 8px 40px 0}
  /* Day type in the day view. It sits in the timeline's scroller as a sticky strip rather
     than beside the date, which crowded the header and stretched the date field. */
  #day-banner{position:sticky; top:0; z-index:7; display:flex; align-items:center; gap:8px;
    margin:0 0 2px 0; padding:5px 10px; font-size:11.5px; color:var(--dim);
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm)}
  #day-banner[hidden]{display:none}
  #day-banner .lbl{font-weight:600; color:var(--text)}
  @media (max-width:1040px){ main{grid-template-columns:minmax(0,1fr) 280px} }
  #timeline{position:relative; margin:14px 0 0 56px}
  .hourline{position:absolute; left:-50px; right:0; border-top:1px solid var(--line)}
  .hourlabel{position:absolute; left:-52px; transform:translateY(-7px); width:44px; text-align:right; color:var(--dim); font-size:11px}
  .block{
    position:absolute; left:0; right:14px; border-radius:7px; overflow:hidden;
    padding:3px 8px; color:#fff; cursor:grab; border:1.5px solid transparent;
    box-shadow:inset 3px 0 0 rgba(0,0,0,.25);
  }
  .block .bt{font-size:12px; font-weight:600; display:flex; gap:4px; min-width:0; align-items:baseline}
  /* flex-shrink 9999 vs 1: the project prefix gives up all its width before the work
     package loses a single character */
  .lp{opacity:.72; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:0 9999 auto; min-width:0}
  .ln{flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .block .bm{font-size:10.5px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .block.sel{border-color:var(--text); box-shadow:inset 3px 0 0 rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.25)}
  .block.unlabeled{background:repeating-linear-gradient(45deg,var(--line),var(--line) 7px,var(--card2) 7px,var(--card2) 14px); color:var(--text)}
  .block.running::after{content:"●"; position:absolute; top:3px; right:6px; color:#fff; font-size:9px; animation:pulse 1.6s infinite}
  .rz{position:absolute; left:0; right:0; height:7px; cursor:ns-resize; z-index:2}
  .rz-top{top:0} .rz-bot{bottom:0}
  @keyframes pulse{50%{opacity:.3}}
  .seam{position:absolute; left:0; right:14px; height:11px; transform:translateY(-5.5px); cursor:row-resize; z-index:3}
  .seam .ln{position:absolute; top:5px; left:0; right:0; border-top:1px solid transparent}
  .seam:hover .ln{border-top:1px dashed var(--accent-bright)}
  .seam .mrg{position:absolute; right:0; top:0; transform:translateY(-3px); display:none;
    background:var(--card); border:1px solid var(--line); color:var(--dim); border-radius:6px; font-size:11px; padding:1px 6px; cursor:pointer}
  .seam:hover .mrg{display:block}
  .seam .mrg:hover{color:var(--text); border-color:var(--accent)}
  #nowline{position:absolute; left:-50px; right:14px; border-top:2px solid var(--focus); z-index:2; pointer-events:none}
  #nowline::before{content:""; position:absolute; left:-4px; top:-4px; width:7px; height:7px; border-radius:50%; background:var(--focus)}
  /* scrub rail: the hour-label strip is the marker's home and drag surface */
  #gutter{position:absolute; left:-56px; width:56px; top:0; bottom:0; z-index:0; cursor:row-resize; border-right:1px solid var(--line)}
  #gutter:hover{background:var(--accent-ghost)}
  #gutter .gh{position:absolute; left:0; right:0; border-top:1px dashed var(--accent-bright); opacity:0; pointer-events:none}
  #gutter:hover .gh{opacity:.55}
  #playhead{position:absolute; left:-56px; right:14px; border-top:2px solid var(--accent-bright); z-index:5; pointer-events:none}
  #playhead .ph-hit{position:absolute; left:0; right:0; top:-5px; height:11px; pointer-events:auto; cursor:row-resize}
  #playhead .ph-handle{position:absolute; left:0; top:-7px; width:0; height:0; border-style:solid; border-width:7px 0 7px 11px; border-color:transparent transparent transparent var(--accent-bright); pointer-events:auto; cursor:row-resize}
  #playhead .ph-time{position:absolute; left:13px; top:-8px; font-size:10px; font-weight:600; color:var(--on-accent); background:var(--accent-bright); padding:1px 4px; border-radius:3px; font-variant-numeric:tabular-nums}
  #ghost{position:absolute; left:0; right:14px; background:var(--accent-ghost); border:1px solid var(--accent-bright); border-radius:7px; display:none; pointer-events:none; z-index:1}
  /* ---- rail ---- */
  #rail{border-left:1px solid var(--line); padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
  .card{background:var(--card); border-radius:var(--radius); padding:14px}
  .card h3{margin:0 0 10px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); font-weight:600}
  .field{display:block; margin-bottom:9px}
  .field label{display:block; font-size:11px; color:var(--dim); margin-bottom:3px}
  select,input[type=text],input[type=time],input[type=number],textarea{
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius-sm); padding:8px; font-family:inherit; font-size:13px;
  }
  select:focus,input:focus,textarea:focus{outline:none; border-color:var(--accent)}
  /* Descriptions are the payload of the whole tool — the box grows with the text instead of
     hiding it in a one-line viewport. Height is set from scrollHeight on every input. */
  .desc-wrap{position:relative}
  .desc-wrap textarea{display:block; resize:none; overflow:hidden; line-height:1.45; min-height:34px; max-height:40vh}
  .taginp{font-variant-numeric:tabular-nums}
  /* The composed Projectile cell, shown while typing so the machine-readable form is never
     a surprise at export time. */
  .tagprev{margin-top:5px; font-size:11.5px; color:var(--dim); word-break:break-word; min-height:1em}
  .sugg{position:absolute; left:0; right:0; top:100%; z-index:40; margin-top:2px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    box-shadow:0 8px 22px rgba(0,0,0,.28); max-height:172px; overflow-y:auto}
  .sugg div{padding:6px 8px; font-size:12.5px; cursor:pointer; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .sugg div.on,.sugg div:hover{background:var(--accent-ghost)}
  .row{display:flex; gap:8px}
  .row>*{flex:1}
  .nowbtns{display:flex; gap:8px; margin-top:10px}
  .nowbtns .btn{flex:1; text-align:center}
  .elapsed{font-size:34px; font-weight:600; letter-spacing:-1.5px; margin:6px 0 2px}
  .dim{color:var(--dim)}
  .tline{display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line)}
  .tline:last-child{border-bottom:none}
  .tline .sw{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:8px; vertical-align:-1px}
  .ttot{display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-weight:600}
  .compl{margin-top:10px; padding:8px 10px; border-radius:var(--radius-sm); font-size:12.5px}
  .compl.ok{background:var(--accent-soft); color:var(--accent-bright)}
  .compl.warn{background:rgba(244,186,64,.16); color:var(--break)}
  /* A warning you can act on: same box, but it is a button that jumps to the first day
     carrying the problem it is counting. */
  button.compl{display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    font:inherit; font-size:12.5px; border:1px solid transparent; cursor:pointer}
  button.compl:hover{border-color:var(--break)}
  button.compl .go-arr{margin-left:auto; opacity:.7; font-size:15px; line-height:1}
  /* A day that needs attention is hatched, the way an unlabeled block is on the timeline —
     visible before you read a single flag. */
  .mo-cell.flagged, .wk-col.flagged{
    background-image:repeating-linear-gradient(45deg,transparent,transparent 7px,
      rgba(244,186,64,.10) 7px,rgba(244,186,64,.10) 14px)}
  /* ---- modal ---- */
  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50}
  .modal{background:var(--card); border-radius:var(--radius); box-shadow:0 8px 32px rgba(0,0,0,.5); width:min(540px,92vw); max-height:86vh; overflow:auto; padding:20px}
  .modal h2{margin:0 0 14px; font-size:16px}
  .sub-h{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); margin:16px 0 8px}
  .modal.wide{width:min(820px,95vw)}
  .ptable{display:grid; grid-template-columns:50px 122px minmax(118px,1fr) 108px 92px 108px 52px 24px; gap:7px; align-items:center}
  /* ---- month view ---- */
  #monthview{padding:14px 14px 40px 14px}
  .mo-head{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px}
  .mo-head>div{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600; text-align:center}
  .mo-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
  .mo-cell{background:var(--card2); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:6px 7px; min-height:72px; display:flex; flex-direction:column; gap:3px; cursor:pointer}
  .mo-cell:hover{background:var(--hover-soft); border-color:var(--accent)}
  .mo-cell.out{opacity:.35}
  .mo-cell.we{background:transparent}
  .mo-cell.today{border-color:var(--accent-bright); box-shadow:inset 0 0 0 1px var(--accent-bright)}
  .mo-top{display:flex; align-items:center; justify-content:space-between; gap:4px}
  .mo-date{font-size:12px; font-weight:600}
  .mo-cell.today .mo-date{color:var(--accent-bright)}
  /* Day-type chip — one component, shown in the month grid, the week strip and the day header. */
  .dt-badge{display:inline-block; font-size:9px; font-weight:700; padding:1px 4px; border-radius:3px;
    letter-spacing:.04em; background:var(--accent-soft); color:var(--accent-bright); white-space:nowrap; vertical-align:1px}
  .dt-badge.vacation{background:rgba(244,186,64,.18); color:var(--break)}
  .dt-badge.sick{background:rgba(206,63,50,.18); color:var(--focus)}
  .dt-badge.lg{font-size:10.5px; padding:2px 7px; border-radius:var(--radius-pill); letter-spacing:.02em}
  .dt-row{display:flex; align-items:center; gap:10px}
  .dt-row select{flex:1; min-width:0}
  .dt-row .chk{flex:0 0 auto; white-space:nowrap}
  .dt-row .chk:has(input:disabled){opacity:.45}
  .mo-h{font-size:12.5px; font-variant-numeric:tabular-nums}
  .mo-split{height:3px; border-radius:2px; overflow:hidden; display:flex; background:var(--line)}
  .mo-split>i{display:block; height:100%}
  .mo-flags{margin-top:auto; display:flex; gap:3px; flex-wrap:wrap}
  @media (max-width:820px){
    #monthview{padding:10px 10px 32px 10px}
    .mo-cell{min-height:58px; padding:4px 5px}
    .mo-h{font-size:11px}
  }
  .firstrun{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--dim)}
  .sep-prev{font-variant-numeric:tabular-nums}
  .sep-prev b{color:var(--accent-bright); font-weight:600}
  .colcell{display:flex; align-items:center; gap:1px; min-width:0}
  .colcell input[type=color]{flex:1; min-width:0}
  .colcell input.inh{border-style:dashed !important; opacity:.85}
  .prow.arch input,.prow.arch select{opacity:.5}
  .ptable.add{margin-top:0}
  .ptable .ph{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600; padding-bottom:2px}

  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px}
  /* ---- week view ---- */
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden}

  .seg button.on{background:var(--accent-bright); color:var(--on-accent); font-weight:600}

  kbd{

  .hk:hover{border-color:var(--accent)}

  .wk-hint{margin:10px 0 0 46px}

  .th-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
  .th-f{flex:1; min-width:92px}
  .th-f label{display:block; font-size:11px; color:var(--dim); margin-bottom:3px}
  .th-f input[type=color]{width:100%; height:32px; padding:2px; background:var(--card2); border:1px solid var(--line); border-radius:var(--radius-sm); cursor:pointer}
  .th-presets{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px}
  .th-p{display:flex; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden; cursor:pointer; padding:0; background:none}
  .th-p:hover{border-color:var(--accent-bright)}
  .th-p i{display:block; width:17px; height:17px}
  /* ---- export ---- */
  .xwrap{overflow-x:auto; margin:12px 0}
  table.xt{border-collapse:collapse; width:100%; font-size:12.5px}
  table.xt th{text-align:left; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600; padding:4px 8px; border-bottom:1px solid var(--line)}
  table.xt td{padding:0; border-bottom:1px solid var(--line)}
  table.xt td .xc{padding:6px 8px; cursor:pointer; border:1.5px solid transparent; border-radius:5px; white-space:nowrap; transition:background var(--t)}
  table.xt td .xc:hover{background:var(--card2)}
  table.xt td .xc.cur{border-color:var(--accent-bright); background:var(--accent-ghost)}
  table.xt td .xc.done{color:var(--dim)}
  .xbar{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--dim); margin-bottom:4px}
  .xbar .prog{margin-left:auto; font-variant-numeric:tabular-nums}
  #toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:9px 14px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60}
  #toast.show{opacity:1}
  .hint{font-size:11px; color:var(--dim); margin-top:6px; line-height:1.4}
  .m-only{display:none}
  @media (max-width:820px){
    /* one pane at a time: the timeline keeps its own scroll, the rail is a toggled panel */
    main{grid-template-columns:minmax(0,1fr)}
    #timeline-wrap,#rail{grid-column:1; grid-row:1; width:100%; min-width:0}
    #timeline-wrap{padding:0 10px 32px 0}
    #timeline{margin-left:44px}
    #gutter{left:-44px; width:44px}
    .hourlabel{left:-42px; width:36px}
    .hourline{left:-40px}
    #playhead{left:-44px}
    #nowline{left:-40px}
    #rail{border-left:none; overflow-y:auto}
    body:not(.show-rail) #rail{display:none}
    body.show-rail #timeline-wrap{display:none}
    .m-only{display:inline-flex}
    .toolbar{margin-left:0; width:100%}
    .datenav{flex:1 1 auto}
    /* week: fit 7 columns without scrolling the page sideways */
    #weekview{padding:12px 10px 32px 0}
    .wk-head,.wk-grid{grid-template-columns:34px repeat(7,minmax(0,1fr)); min-width:0}
    .wk-hint{margin-left:34px}
    .wk-blk{font-size:8px; padding:1px 2px; left:1px; right:1px}
    .wk-dt{font-size:10px}
  }
</style>

"use strict";
/* =====================================================================
   Projector — the whole thing in one idea:

     A day is ONE gapless track of blocks. Everything else is a view of
     that track or an edit to it.

   Blocks abut exactly (block[i].end === block[i+1].start), so there is no
   gap to manage: editing is splitting at a marker or dragging a seam. Each
   block points at a POSITION (what Projectile books) and carries free text.

   Positions nest two levels — project → work package — with three
   orthogonal axes hung off them:
     · billability  factura / internal, inherited from the parent
     · colour       inherited from the parent, overridable
     · Themenarbeit the description is machine-readable "Hub | PEG | text",
                    and the sub-positions become Hub and PEG rows

   Export merges consecutive blocks into rows and walks you cell by cell.
   Nothing persists but `state` in localStorage; every mutation ends in
   save() + render().

   Sections below, in order: storage · i18n · theme · time & position
   helpers · rendering (chrome / timeline / rail / input helpers) · live
   loop · editing · pointer interactions · navigation · positions manager ·
   backup · keyboard · shortcuts · week · month · export · ICS · modals ·

function toRgb(h){ h=String(h).replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function toHex(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,w){ const A=toRgb(a),B=toRgb(b); return toHex(A.map((v,i)=>v+(B[i]-v)*w)); }
function rgba(h,a){ const [r,g,b]=toRgb(h); return `rgba(${r},${g},${b},${a})`; }
function lum(h){ const [r,g,b]=toRgb(h).map(v=>{ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*r+0.7152*g+0.0722*b; }
function contrast(a,b){ const l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); }
function toHsl(h){
  const [r,g,b]=toRgb(h).map(v=>v/255);
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, l=(mx+mn)/2;
  let hu=0, sa=0;
  if(d){
    sa=d/(1-Math.abs(2*l-1));
    hu = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4);
    hu*=60;
  }
  return [hu,sa,l];
}
function fromHsl(hu,sa,l){
  hu=((hu%360)+360)%360; sa=Math.max(0,Math.min(1,sa)); l=Math.max(0,Math.min(1,l));
  const c=(1-Math.abs(2*l-1))*sa, x=c*(1-Math.abs((hu/60)%2-1)), m=l-c/2;
  const seg=[[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(hu/60)%6];
  return toHex(seg.map(v=>(v+m)*255));
}

const THEME_DEFAULT={bg:'#1c1b22',text:'#e5e5e5',accent:'#757c58'};
const THEME_PRESETS=[
  {n:'Olive', bg:'#1c1b22', text:'#e5e5e5', accent:'#757c58'},
  {n:'Slate', bg:'#161a20', text:'#e3e8ee', accent:'#4a6fa5'},
  {n:'Plum',  bg:'#1e1a22', text:'#e9e3ea', accent:'#8a5f86'},
  {n:'Ember', bg:'#1f1b19', text:'#ece5df', accent:'#a2603c'},
  {n:'Paper', bg:'#f2f0e9', text:'#23221e', accent:'#636f45'}
];
// Everything is derived from three inputs by mixing toward the *opposite* end of the
// bg/text axis, so a light background produces a light theme automatically and no
// combination can render text illegible against its own surface.
function applyTheme(){
  const th=Object.assign({},THEME_DEFAULT,(state&&S().theme)||{});
  const {bg,text,accent}=th, r=document.documentElement.style;
  r.setProperty('--bg',bg);
  r.setProperty('--text',text);
  r.setProperty('--card',   mix(bg,text,0.07));
  r.setProperty('--card2',  mix(bg,text,0.045));
  r.setProperty('--line',   mix(bg,text,0.16));
  // Perceptual luminance is non-linear: the same mix weight yields much weaker contrast on a
  // light background. Weight asymmetrically so --dim clears WCAG AA (4.5) in both directions
  // without flattening the muted hierarchy the dark theme relies on.
  r.setProperty('--dim',    mix(text,bg,lum(bg)>0.5?0.30:0.40));
  r.setProperty('--accent', accent);
  const bright=mix(accent,text,0.30);
  r.setProperty('--accent-bright',bright);
  r.setProperty('--accent-hover', mix(accent,text,0.46));
  r.setProperty('--on-accent', contrast(bright,'#111111')>=contrast(bright,'#ffffff')?'#111111':'#ffffff');
  r.setProperty('--accent-soft',  rgba(accent,0.22));
  r.setProperty('--accent-ghost', rgba(bright,0.16));
  r.setProperty('--hover-soft',   rgba(text,0.035));
  // Factura vs Intern used to be accent-bright vs --dim. On a light ground both collapse
  // toward the same mid-grey, making the split bar unreadable. Intern is now derived from
  // the accent by rotating the hue far away and holding a fixed saturation, so the pair
  // stays distinguishable whatever accent is tuned in — including a blue one.
  // Hue alone separates them for normal vision but not for a colour vision deficiency, so
  // the lightness is pushed apart as well — away from the background, where there is room.
  const [hu,,lf]=toHsl(bright);
  const light=lum(bg)>0.5;
  const intern=fromHsl(hu+150, 0.32, Math.max(0.16,Math.min(0.84, lf+(light?-0.17:0.17))));
  r.setProperty('--intern',intern);
  // Standalone windows tint their chrome from this; keep it on the actual background.
  const tc=document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content',bg);
}

const LEGACY_KEY='projectile-buddy-v1';   // pre-rename store; migrate once, never drop data
function load(){
  try{
    let raw=localStorage.getItem(KEY);
    if(raw==null&&!DEMO){
      const old=localStorage.getItem(LEGACY_KEY);
      if(old!=null){ localStorage.setItem(KEY,old); raw=old; }   // keep the legacy copy as a safety net
    }
    state=JSON.parse(raw)||(DEMO?demoData():defaults());
  }
  catch(e){ state=DEMO?demoData():defaults(); }
  if(!state.positions.some(p=>p.id==='pause')) state.positions.unshift(defaults().positions[0]);
  state.settings=Object.assign({},defaults().settings,state.settings||{});
  if(!state.dayTypes||typeof state.dayTypes!=='object') state.dayTypes={};
  // The separator shipped as ';' before descriptions learned to drop their trailing period;
  // with that in place the intended form is '; '. Only the untouched old default is moved.
  if(state.settings.descSep===';') state.settings.descSep='; ';
  lang=S().lang||'de';
  if(migratePositions()|ensureHotkeys()) save();
}
// One-time repairs of stores written before colour inheritance and cascading archive existed.
function migratePositions(){
  let changed=false;
  state.positions.forEach(p=>{
    const par=projectOf(p); if(!par||!p.color) return;
    // Colours used to be *copied* from the project at creation time. Where the copy is still
    // untouched, drop it so the child starts tracking its project; a real override survives.
    const c=p.color.toLowerCase();
    if(c===mix(par.color||'#5e7ce0','#ffffff',0.18).toLowerCase() || c===(par.color||'').toLowerCase()){
      p.color=null; changed=true;
    }
  });
  // Archiving a project used to leave its packages behind, unarchived and still bookable.
  state.positions.forEach(p=>{
    if(p.archived) return;
    const par=projectOf(p);
    if(par&&par.archived){ p.archived=true; p.hotkey=null; changed=true; }
  });
  return changed;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); }

/* ============================ time helpers ============================ */
const S=()=>state.settings;
function todayMid(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function dayStartMs(){ return selectedDate.getTime(); }
function isToday(){ return dayStartMs()===todayMid(); }
function now(){ return Date.now(); }
function bEnd(b){ return b.end==null?now():b.end; }
function minOfDay(ms){ return (ms-dayStartMs())/60000; }
function nowMin(){ return (now()-dayStartMs())/60000; }
function snapMin(m){ const s=S().snapMin; return Math.round(m/s)*s; }
function snapMs(ms){ return dayStartMs()+snapMin((ms-dayStartMs())/60000)*60000; }
function fmtHM(ms){ const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDur(ms){ const m=Math.max(0,Math.round(ms/60000)); return Math.floor(m/60)+':'+pad(m%60); }
// Targets are stored as decimal hours but a contract is written as 41 h / week = 8:12 a day.
// Accept both notations (and the German decimal comma); render the stored value as HH:MM.
function parseHours(s){
  s=(s||'').trim().replace(',','.');
  if(!s) return null;
  const hm=/^(\d{1,3}):([0-5]?\d)$/.exec(s);
  if(hm) return +hm[1]+ (+hm[2])/60;
  if(!/^\d*\.?\d+$/.test(s)) return null;
  const v=parseFloat(s);
  return isFinite(v)&&v>=0 ? v : null;
}
// Day tallies are fractional now, so 1 stays "1" and 1.5 reads "1,5" in German.
function fmtDays(n){
  const v=Math.round(n*2)/2;
  return v===Math.trunc(v) ? String(v) : v.toFixed(1).replace('.',lang==='de'?',':'.');
}
function fmtHours(h){
  const m=Math.round((+h||0)*60);
  return Math.floor(m/60)+':'+pad(m%60);
}
function parseHMok(s){ const m=/^(\d{1,2}):(\d{2})$/.exec((s||'').trim()); if(!m)return null; const h=+m[1],mi=+m[2]; if(h>23||mi>59)return null; const d=new Date(dayStartMs()); d.setHours(h,mi,0,0); return d.getTime(); }

// DST-safe date arithmetic — never add DAY to a timestamp to move by days.
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); return addDays(x,-((x.getDay()+6)%7)); }  // ISO: Monday
function isoWeekNo(d){
  const t=new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));            // Thursday of this week
  const w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/DAY-3+((w1.getDay()+6)%7))/7);
}
function blocksOfDay(dayMs){
  return state.blocks.filter(b=>b.start>=dayMs&&b.start<dayMs+DAY).sort((a,b)=>a.start-b.start);
}

/* --- day types ---
   A target is a claim about days you were *supposed* to work, so the app needs to know which
   days those aren't. A marked day contributes nothing to the target; blocks tracked on it
   still count as worked, so an hour booked on a holiday reads as overtime, not as a hole. --- */
const DAY_TYPES=['holiday','vacation','sick'];
function isoDate(ms){ const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
/* A day off is stored as the bare type string for a whole day — the shape every store
   written before half days used — or as {t,f} once a fraction is involved. Reading goes
   through dayType/dayOff so no caller has to know which of the two it is looking at. */
function dtEntry(ms){ return (state.dayTypes||{})[isoDate(ms)]; }
function dayType(ms){
  const v=dtEntry(ms);
  const ty=(v&&typeof v==='object')?v.t:v;
  return DAY_TYPES.includes(ty)?ty:null;
}
// How much of the day the absence takes: 0 when working, 0.5 for a half day, 1 for a whole.
function dayOff(ms){
  if(!dayType(ms)) return 0;
  const v=dtEntry(ms);
  return (v&&typeof v==='object'&&v.f>0&&v.f<1) ? v.f : 1;
}
function isHalfDay(ms){ const f=dayOff(ms); return f>0&&f<1; }
function setDayType(ms,v,half){
  state.dayTypes=state.dayTypes||{};
  if(v&&DAY_TYPES.includes(v)) state.dayTypes[isoDate(ms)] = half ? {t:v,f:0.5} : v;
  else delete state.dayTypes[isoDate(ms)];
  save();
}
// Short chip for grids and strips; `full` spells the type out where there is room for it.
// `half` appends ½, so a half day is never mistaken for a whole one at a glance.
function dtBadge(type,full,half){
  if(!type) return '';
  const name=esc(t('dt_'+type))+(half?' ½':'');
  return `<span class="dt-badge ${type}${full?' lg':''}" title="${name}">${
    (full?esc(t('dt_'+type)):t('dtShort_'+type))+(half?'½':'')}</span>`;
}
function isWeekday(ms){ const wd=new Date(ms).getDay(); return wd>=1&&wd<=5; }
// A day is expected whenever a weekday is not *entirely* off — half a day off still owes
// half a day of work, and still counts as a day that should have something tracked on it.
function isExpected(ms){ return isWeekday(ms)&&dayOff(ms)<1; }

// The weekly target is the contract figure, scaled by how much of the week is still expected.
function weekTargetMs(ws){
  const full=(S().weekTargetHours||0)*3600000;
  let expected=0, weekdays=0;
  // Fractional, so half a day off takes half a day out of the weekly figure too.
  for(let i=0;i<7;i++){ const dm=addDays(ws,i).getTime(); if(isWeekday(dm)){ weekdays++; expected+=1-dayOff(dm); } }
  return weekdays ? full*expected/weekdays : 0;
}
function dayBlocks(){ return blocksOfDay(dayStartMs()); }
/* --- one walk over a list of blocks ---
   The day, week and month views all want the same five numbers, and used to each carry
   their own copy of this loop — so every new figure (the Hub warning was the last one) had
   to be added in three places, correctly, three times. `per` is minutes by position id,
   with unlabeled time under '__un'. --- */
function statsFor(blocks){
  const per={}; let work=0, pause=0, unlabeled=0;
  blocks.forEach(b=>{
    const dur=bEnd(b)-b.start;
    per[b.positionId||'__un']=(per[b.positionId||'__un']||0)+dur;
    if(b.positionId===PAUSE()) pause+=dur;
    else if(b.positionId) work+=dur;
    else unlabeled++;                       // unlabeled time counts toward neither
  });
  return {per, work, pause, unlabeled, noWg:untaggedBlocks(blocks).length, count:blocks.length};
}
// Roll a run of daily stats into one total; `per` is summed key by key.
function sumStats(list){
  const out={per:{}, work:0, pause:0, unlabeled:0, noWg:0, count:0};
  list.forEach(s=>{
    out.work+=s.work; out.pause+=s.pause; out.unlabeled+=s.unlabeled;
    out.noWg+=s.noWg; out.count+=s.count;
    for(const k in s.per) out.per[k]=(out.per[k]||0)+s.per[k];
  });
  return out;
}
function runningBlock(){ return state.blocks.find(b=>b.end==null); }
function posById(id){ return state.positions.find(p=>p.id===id); }
function PAUSE(){ return 'pause'; }

/* --- two orthogonal axes on Position ---
   1) hierarchy: parentId (2 levels — project → work package). A position with children is a
      container and is NOT bookable; every leaf is.
   2) billability: billable true/false, inherited from the parent when null. Kept separate
      from the tree because a client project can contain a non-billable package. Unset at the
      root resolves to *internal* — under-claiming billable time is the safe direction. --- */
function childrenOf(id){ return state.positions.filter(p=>p.parentId===id&&!p.archived); }
function isBookable(p){ return !!p && childrenOf(p.id).length===0; }
function projectOf(p){ return p&&p.parentId ? posById(p.parentId) : null; }
function rootOf(p){ return projectOf(p)||p; }
// Archiving a project must take its work packages with it. Checking only p.archived left
// orphans behind: still unarchived, still bookable, grouped under a project that was gone
// from the manager — so a deleted project kept polluting every picker.
function posVisible(p){
  if(!p||p.archived) return false;
  const par=projectOf(p);
  return par ? posVisible(par) : true;
}
// Colour is inherited, not copied: a child without its own colour tracks the project, so
// recolouring a project recolours the whole tree. An explicit colour on the child wins.
function posColor(p){
  if(!p) return 'var(--line)';
  if(p.color) return p.color;
  const par=projectOf(p);
  return par ? mix(posColor(par),'#ffffff',0.18) : '#5e7ce0';
}
function pathLabel(p){ const par=projectOf(p); return par ? `${par.label} › ${p.label}` : (p?p.label:''); }
// Real project/package names are long. Render them as two spans so the *project* prefix
// absorbs the truncation and the work package — the informative half — stays readable.
function splitLabelHtml(p){
  if(!p) return '';
  const par=projectOf(p);
  return par ? `<span class="lp">${esc(par.label)} ›</span><span class="ln">${esc(p.label)}</span>`
             : `<span class="ln">${esc(p.label)}</span>`;
}
// Compact form for chips: the code is already short by design; fall back to a clipped label.
function chipLabel(p){
  if(!p) return '';
  if(p.code && p.code.length<=14) return p.code;
  const l=p.label||'';
  return l.length>14 ? l.slice(0,13)+'…' : l;
}
/* --- Themenarbeit: machine-readable descriptions ---
   Some booking codes are typed into Projectile with a description the unit parses:
       <Hub> | <PEG or None> | free text
   A position marked `tagged` is such a code. Its sub-positions are then not booking codes
   of their own but *Hub rows* and *PEG rows*: they book on the parent and only supply the
   two tags. That keeps hotkeys, quick-pick, colours and the week rollup working untouched —
   a Hub row is an ordinary position. A PEG row carries its Hub as well, because the third
   level it would otherwise hang under does not exist. --- */
function isTagged(p){ return !!p && p.tagged===true; }
function isPreset(p){ return isTagged(projectOf(p)); }
function isTaggedBlock(b){ const p=posById(b&&b.positionId); return isTagged(p)||isPreset(p); }
// The code Projectile actually books: the work package itself, or, for a Hub / PEG row,
// the Themenarbeit parent it hangs under.
function bookingCodeOf(p){ return isPreset(p) ? projectOf(p) : p; }
function presetOf(b){ const p=posById(b&&b.positionId); return isPreset(p)?p:null; }
// Tags inherit from the Hub / PEG row and are overridable per block — the same shape as
// colour and billability, so renaming a row's tag also fixes every block booked on it.
// Absent (null / undefined) means inherit; an empty string is an explicit *none*, which is
// how a block gets booked on a PEG row without that PEG. Treating "" as inherit made the
// cleared field silently fill itself back in.
function effTag(b,f){
  const v=b&&b[f];
  if(v!=null) return v;
  const pr=presetOf(b); return (pr&&pr[f])||'';
}
// A blank separator would fuse the three fields into one cell the unit's parser cannot
// split, so it falls back to the default rather than being taken literally.
function tagSep(){ const s=S().tagSep; return (s==null||s==='')?' | ':s; }
function tagNone(){ const s=S().tagNone; return s==null?'None':s; }
function tagParts(wg,prj,text){
  return [(wg||'').trim(), (prj||'').trim()||tagNone(), text].join(tagSep());
}
// The separator has to survive the round trip into a single Projectile cell, so it can
// never appear inside a tag itself.
function cleanTag(v){ const sep=tagSep().trim()||'|'; return String(v||'').split(sep).join('').trim(); }
// Every place that shows or exports a description goes through here, so the timeline, the
// calendar file and the Projectile cell cannot drift apart.
function composedDesc(b){
  const d=(b.description||'').trim();
  if(!isTaggedBlock(b)) return d;
  return tagParts(effTag(b,'wg'),effTag(b,'prj'),d);
}
// A Themenarbeit block without a Hub exports a leading empty field — worth a warning, but
// not worth blocking the export the way a missing position does.
function untaggedBlocks(blocks){ return blocks.filter(b=>isTaggedBlock(b)&&!effTag(b,'wg')); }

function isBillable(p){
  if(!p||p.reserved) return false;               // Pause is neither factura nor internal
  if(p.billable!=null) return !!p.billable;
  const par=projectOf(p);
  return par ? isBillable(par) : false;
}
function isPause(p){ return !!p&&p.id===PAUSE(); }
// Buckets a day/week of blocks into factura / internal / pause.
function splitBillable(blocks){
  let fact=0, intern=0, pause=0;
  blocks.forEach(b=>{
    const p=posById(b.positionId); if(!p) return;
    const d=bEnd(b)-b.start;
    if(isPause(p)) pause+=d; else if(isBillable(p)) fact+=d; else intern+=d;
  });
  return {fact,intern,pause};
}

/* --- hotkeys: a stable property of the position, never derived from sort order, so
   muscle memory can't silently start booking to the wrong project. --- */
function posByHotkey(n){ return state.positions.find(p=>p.hotkey===n&&posVisible(p)&&isBookable(p)); }
function freeHotkey(){ for(let i=1;i<=9;i++) if(!posByHotkey(i)) return i; return null; }
function ensureHotkeys(){
  let changed=false;
  // Real projects claim the low digits first; the reserved "Pause" takes what's left, so an
  // upgrading store doesn't hand slot 1 to a break.
  state.positions.filter(p=>posVisible(p)&&!p.hotkey&&isBookable(p))
    .sort((a,b)=> (a.reserved?1:0)-(b.reserved?1:0))
    .forEach(p=>{ const n=freeHotkey(); if(n){ p.hotkey=n; changed=true; } });
  return changed;
}

/* --- warnings: from a count to a place ---
   A count in a rail says something is wrong somewhere in the week or month; on its own it
   sends you opening days one by one. These turn a count into a day and a block to jump to,
   and into a short flag on the day itself. --- */
function issueBlocks(kind,blocks){
  if(kind==='unlabeled') return blocks.filter(b=>!b.positionId);
  if(kind==='noWg') return untaggedBlocks(blocks);
  return [];
}
// First day at or after `fromMs` (searching `span` days) that carries this kind of problem,
// plus the block responsible where there is one. The break rule is a property of the day.
function findIssue(kind,fromMs,span){
  for(let i=0;i<span;i++){
    const dm=fromMs+i*DAY, bl=blocksOfDay(dm);
    if(kind==='break'){ if(complianceOf(bl).viol) return {ms:dm,id:null}; continue; }
    if(kind==='missing'){ if(isExpected(dm)&&!bl.length) return {ms:dm,id:null}; continue; }
    const bad=issueBlocks(kind,bl)[0];
    if(bad) return {ms:dm,id:bad.id};
  }
  return null;
}
function gotoIssue(kind,fromMs,span){
  const hit=findIssue(kind,fromMs,span);
  if(!hit){ toast(t('tNoIssue')); return; }
  selectedDate=new Date(hit.ms); viewMode='day';
  if(hit.id) selectAndReveal(hit.id); else { selectedId=null; render(); }
}
// A rail warning is a button, so the count you are reading is also the way to reach it.
function issueBtn(kind,fromMs,span,label){
  return `<button class="compl warn go" data-issue="${kind}" data-from="${fromMs}" data-span="${span}">
    ${label}<span class="go-arr">›</span></button>`;
}
// The short flags a day carries, worst first. Shared by the month grid and the week rows so
// the two can never disagree about what counts as a bad day.
function dayFlagsHtml(s){
  if(!s) return '';
  return (s.unlabeled?`<span class="flag warn" title="${esc(t('unlabeledWarn',s.unlabeled))}">${t('shortUnlabeled')}</span>`:'')
       +(s.noWg?`<span class="flag warn" title="${esc(t('noWgWarn',s.noWg))}">${t('shortNoWg')}</span>`:'')
       +(s.compl&&s.compl.viol?`<span class="flag warn" title="${esc(t('warnBreak'))}">${t('complWarnShort')}</span>`:'');
}
function dayFlagged(s){ return !!s && !!(s.unlabeled||s.noWg||(s.compl&&s.compl.viol)); }

/* ============================ rendering ============================ */
function render(){
  renderHeader();
  const wk=viewMode==='week', mo=viewMode==='month';
  el('timeline').hidden=wk||mo; el('weekview').hidden=!wk; el('monthview').hidden=!mo;
  if(wk){ renderWeek(); }
  else if(mo){ renderMonth(); }
  else { renderDayBanner(); renderTimeline(); renderNow(); renderEditor(); renderTotals(); }
  if(wk||mo) el('day-banner').hidden=true;
}
function renderDayBanner(){
  const b=el('day-banner'), ty=dayType(dayStartMs());
  b.hidden=!ty;
  // A half day still owes half a target, so it must not claim there is none.
  const half=isHalfDay(dayStartMs());
  if(ty) b.innerHTML=`${dtBadge(ty,true,half)}<span class="lbl">${
    half?t('dayTypeBannerHalf',fmtHours(dayTargetMs(dayStartMs())/3600000)):t('dayTypeBanner')}</span>`;
}

function renderHeader(){
  const d=selectedDate;
  document.documentElement.lang = lang==='de'?'de':'en-GB';
  if(viewMode==='week'){
    const ws=startOfWeek(d), we=addDays(ws,6);
    const f=x=>`${pad(x.getDate())}.${pad(x.getMonth()+1)}.`;
    el('date-label').textContent=`${t('week')} ${isoWeekNo(ws)} · ${f(ws)}–${f(we)}`;
  } else if(viewMode==='month'){
    el('date-label').textContent=d.toLocaleDateString(loc(),{month:'long',year:'numeric'});
  } else {
    el('date-label').textContent=d.toLocaleDateString(loc(),{weekday:'short',day:'2-digit',month:'short'});
  }
  el('v-day').textContent=t('viewDay'); el('v-week').textContent=t('viewWeek'); el('v-month').textContent=t('viewMonth');
  el('v-day').classList.toggle('on',viewMode==='day');
  el('v-week').classList.toggle('on',viewMode==='week');
  el('v-month').classList.toggle('on',viewMode==='month');
  el('today-btn').textContent=t('today');
  el('pos-btn').textContent=t('positions');
  el('data-btn').textContent=t('btnSettings');
  el('ics-btn').textContent=t('btnCalendar');
  el('proj-btn').textContent=t('btnTransfer');
  // Both act on exactly one day, so they are only offered where a single day is on screen.
  // Nothing about them said so, and in month view the selected day is not even visible.
  const dayOnly=viewMode==='day';
  const dayName=d.toLocaleDateString(loc(),{weekday:'short',day:'2-digit',month:'short'});
  [['ics-btn','ttCalendarDay'],['proj-btn','ttTransferDay']].forEach(([id,key])=>{
    const b=el(id);
    b.disabled=!dayOnly;
    b.title=dayOnly?t(key,dayName):t('ttDayOnly');
  });
  el('help-btn').title=t('scHintOpen');
  el('m-toggle').textContent = document.body.classList.contains('show-rail')?t('mTimeline'):t('mDetails');
}

function usageCounts(){
  const m={}; state.blocks.forEach(b=>{ if(b.positionId) m[b.positionId]=(m[b.positionId]||0)+1; }); return m;
}
// Only leaves are bookable — containers never appear in a picker.
// Archived positions are offered only when `keep` is the block's current value: the select
// must still be able to *display* a historical booking without inviting new ones. Anything
// wider (e.g. "used anywhere, ever") resurrects every position you have ever deleted.
function pickerPositions(keep){
  const cnt=usageCounts();
  return state.positions
    .filter(p=>(posVisible(p)||p.id===keep) && isBookable(p))
    .sort((a,b)=> (a.hotkey||99)-(b.hotkey||99) || ((cnt[b.id]||0)-(cnt[a.id]||0)) || pathLabel(a).localeCompare(pathLabel(b)));
}
// Grouped by project so the native select still reads as a tree.
function posOptions(sel){
  let h='<option value=""'+(sel?'':' selected')+'>— '+t('unlabeled')+' —</option>';
  const items=pickerPositions(sel), seen=new Set();
  const opt=p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.label)}${p.reserved?' ⏸':''}</option>`;
  items.filter(p=>!p.parentId).forEach(p=>{ h+=opt(p); seen.add(p.id); });
  const groups={};
  items.filter(p=>p.parentId).forEach(p=>{ (groups[p.parentId]=groups[p.parentId]||[]).push(p); });
  Object.keys(groups).forEach(gid=>{
    const par=posById(gid);
    h+=`<optgroup label="${esc(par?par.label:'—')}">`+groups[gid].map(opt).join('')+`</optgroup>`;
  });
  return h;
}

/* ======================= rendering — the day timeline ======================= */
function renderTimeline(){
  const tl=el('timeline'); const blocks=dayBlocks();
  let minM=S().dayStartHour*60, maxM=S().dayEndHour*60;
  blocks.forEach(b=>{ minM=Math.min(minM,minOfDay(b.start)); maxM=Math.max(maxM,minOfDay(bEnd(b))); });
  if(isToday()) maxM=Math.max(maxM,nowMin());
  minM=Math.max(0,Math.floor(minM/60)*60); maxM=Math.min(24*60,Math.ceil(maxM/60)*60);
  if(maxM<=minM) maxM=minM+60;
  curWinStart=minM;
  const total=maxM-minM;
  tl.style.height=(total*PPM)+'px';
  let h='<div id="gutter"><div class="gh"></div></div>';
  for(let hr=Math.ceil(minM/60); hr<=Math.floor(maxM/60); hr++){
    const y=(hr*60-minM)*PPM;
    h+=`<div class="hourline" style="top:${y}px"></div><div class="hourlabel tabnum" style="top:${y}px">${pad(hr)}:00</div>`;
  }
  blocks.forEach((b,i)=>{
    const top=(minOfDay(b.start)-minM)*PPM, ht=Math.max(13,(minOfDay(bEnd(b))-minOfDay(b.start))*PPM);
    const p=posById(b.positionId);
    const cls='block'+(b.positionId?'':' unlabeled')+(b.id===selectedId?' sel':'')+(b.end==null?' running':'');
    const style=`top:${top}px;height:${ht}px;${p?`background:${posColor(p)};`:''}`;
    const prevAbut=i>0 && Math.abs(blocks[i-1].end-b.start)<1000;
    const nextAbut=i<blocks.length-1 && Math.abs(b.end-blocks[i+1].start)<1000;
    const rzTop=(!prevAbut && ht>=24)?'<div class="rz rz-top"></div>':'';
    const rzBot=(!nextAbut && b.end!=null && ht>=24)?'<div class="rz rz-bot"></div>':'';
    const bd=composedDesc(b);      // tagged blocks show the cell they will export, verbatim
    h+=`<div class="${cls}" data-id="${b.id}" style="${style}">${rzTop}
          <div class="bt">${p?splitLabelHtml(p):esc(t('unlabeled'))}</div>
          <div class="bm tabnum">${fmtHM(b.start)}–${b.end==null?t('nowWord'):fmtHM(b.end)} · ${fmtDur(bEnd(b)-b.start)}${bd?' · '+esc(bd):''}</div>${rzBot}</div>`;
  });
  for(let i=0;i<blocks.length-1;i++){
    const a=blocks[i], c=blocks[i+1];
    if(Math.abs(a.end-c.start)<1000){ // abutting seam
      const y=(minOfDay(a.end)-minM)*PPM;
      h+=`<div class="seam" data-seam="${i}" style="top:${y}px"><div class="ln"></div><button class="mrg" data-merge="${i}">${t('mergeBtn')}</button></div>`;
    }
  }
  if(playhead==null || playhead<dayStartMs() || playhead>dayStartMs()+DAY) playhead = isToday()? now() : dayStartMs()+12*3600000;
  const phM=minOfDay(playhead);
  if(phM>=minM && phM<=maxM){
    h+=`<div id="playhead" style="top:${(phM-minM)*PPM}px"><div class="ph-hit"></div><div class="ph-handle"></div><div class="ph-time">${fmtHM(playhead)}</div></div>`;
  }
  if(isToday() && nowMin()>=minM && nowMin()<=maxM){
    h+=`<div id="nowline" style="top:${(nowMin()-minM)*PPM}px"></div>`;
  }
  h+=`<div id="ghost"></div>`;
  tl.innerHTML=h;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ==================== rendering — the cards in the rail ==================== */
function renderNow(){
  const c=el('now-card'); const run=runningBlock();
  if(!isToday()){
    c.innerHTML=`<h3>${t('pastDay')}</h3><p class="dim" style="margin:0">${t('pastHint')}</p>`;
    return;
  }
  if(run){
    c.innerHTML=`<h3>${t('nowTracking')}</h3>
      <div class="field"><label>${t('position')}</label><select id="now-pos">${posOptions(run.positionId)}</select></div>
      ${tagFieldsHtml(run,'now')}
      <div class="field"><label>${t('description')}</label>
        <div class="desc-wrap">
          <textarea id="now-desc" rows="1" spellcheck="false" placeholder="${t('descPh')}">${esc(run.description||'')}</textarea>
          <div class="sugg" id="now-sugg" hidden></div>
        </div>
        ${isTaggedBlock(run)?`<div class="tagprev tabnum" id="now-prev"></div>`:''}</div>
      <div class="elapsed tabnum" id="now-elapsed">${fmtDur(now()-run.start)}</div>
      <div class="dim tabnum">${t('since',fmtHM(run.start))}</div>
      <div class="nowbtns">
        <button class="btn outline" id="btn-switch" title="${t('tipSwitch')}">${t('switchBtn')}</button>
        <button class="btn outline" id="btn-break" title="${t('tipBreak')}">${t('breakBtn')}</button>
        <button class="btn outline" id="btn-stop" title="${t('tipStop')}">${t('stop')}</button>
      </div>
      <div class="hint" style="margin-top:8px"><a href="#" id="now-help" style="color:var(--accent-bright)">${t('help')}</a></div>`;
    // The position drives which fields exist, so a change has to rebuild the panel.
    el('now-pos').onchange=e=>{ run.positionId=e.target.value||null; save(); render(); };
    const nta=el('now-desc');
    growDesc(nta); closeSugg();
    const nPrev=wireTagFields(run,'now',()=>{ renderTimeline(); renderTotals(); });
    nta.oninput=e=>{ run.description=e.target.value; growDesc(e.target); nPrev();
      openSugg(el('now-sugg'),e.target.value,v=>{ run.description=v; nta.value=v; growDesc(nta); nPrev(); save(); renderTimeline(); });
      save(); renderTimeline(); };
    nta.onblur=()=>setTimeout(closeSugg,120);
    nta.onkeydown=e=>{ if(suggKey(e)) return;
      if(e.key==='Enter'||e.key==='Escape'){ e.preventDefault(); closeSugg(); e.target.blur(); } };
    el('btn-switch').onclick=()=>switchTask();
    el('btn-break').onclick=()=>breakNow();
    el('btn-stop').onclick=()=>stopDay();
    el('now-help').onclick=e=>{ e.preventDefault(); openShortcuts(); };
  } else {
    // An installed home-screen app gets its own storage bucket, so on iOS it starts with an
    // empty store even though the same URL in Safari is full of days. Offer the way back in.
    const fresh=!state.blocks.length;
    c.innerHTML=`<h3>${t('now')}</h3><p class="dim" style="margin:0 0 12px">${t('notTracking')}</p>
      <button class="btn primary" id="btn-start" style="width:100%" title="${t('startHint')}">${t('startDay')}</button>
      <div class="hint" style="margin-top:8px">${t('startHint')} <a href="#" id="now-help" style="color:var(--accent-bright)">${t('help')}</a></div>
      ${fresh?`<div class="firstrun">
        <p style="margin:0 0 8px">${t('firstRunHint')}</p>
        <button class="btn outline" id="fr-imp" style="width:100%">${t('importBackup')}</button>
      </div>`:''}`;
    el('btn-start').onclick=()=>startDay();
    el('now-help').onclick=e=>{ e.preventDefault(); openShortcuts(); };
    const fr=el('fr-imp');
    if(fr) fr.onclick=()=>importFile(data=>{ if(data&&data.blocks&&data.positions){ state=data;
      if(!state.dayTypes) state.dayTypes={};
      lang=S().lang||lang; save(); render(); toast(t('tBackupRestored')); } else toast(t('tNotBackup')); });
  }
}

function renderEditor(){
  const c=el('editor-card');
  const b=state.blocks.find(x=>x.id===selectedId);
  if(!b || dayBlocks().indexOf(b)<0){ c.hidden=true; return; }
  c.hidden=false;
  const running=b.end==null;
  const un=unlabeledBlocks().length;
  const chips=pickerPositions().filter(p=>p.hotkey).sort((a,b2)=>a.hotkey-b2.hotkey).map(p=>
    `<button class="hk${p.id===b.positionId?' on':''}" data-hk="${p.id}" title="${esc(pathLabel(p))}">
       <span class="n">${p.hotkey}</span><span class="sw" style="background:${posColor(p)}"></span><span class="t">${esc(chipLabel(p))}</span>
     </button>`).join('');
  c.innerHTML=`<h3>${t('selectedBlock')}</h3>
    <div class="prog-lbl">${un?t('unlabeledLeft',un):t('allLabeled')}</div>
    <div class="hk-wrap">${chips}</div>
    <div class="field"><label>${t('position')}</label><select id="ed-pos">${posOptions(b.positionId)}</select></div>
    ${tagFieldsHtml(b,'ed')}
    <div class="field"><label>${t('description')}</label>
      <div class="desc-wrap">
        <textarea id="ed-desc" rows="1" spellcheck="false">${esc(b.description||'')}</textarea>
        <div class="sugg" id="ed-sugg" hidden></div>
      </div>
      ${isTaggedBlock(b)?`<div class="tagprev tabnum" id="ed-prev"></div>`:''}</div>
    <div class="row">
      <div class="field"><label>${t('start')}</label><input type="text" id="ed-start" inputmode="numeric" placeholder="HH:MM" value="${fmtHM(b.start)}"></div>
      <div class="field"><label>${t('end')}</label>${running?`<input type="text" value="${t('nowWord')}" disabled>`:`<input type="text" id="ed-end" inputmode="numeric" placeholder="HH:MM" value="${fmtHM(b.end)}">`}</div>
    </div>
    <div class="dim tabnum" style="margin-bottom:10px">${t('duration',fmtDur(bEnd(b)-b.start))}</div>
    <div class="nowbtns">
      <button class="btn outline" id="ed-split">${t('split')}</button>
      <button class="btn outline" id="ed-del">${t('del')} ${TRASH}</button>
    </div>
    <div class="hint">${t('editorHint')}</div>`;
  // A Themenarbeit position brings its own fields along, so switching rebuilds the card.
  el('ed-pos').onchange=e=>{ b.positionId=e.target.value||null; save(); render(); };
  const ta=el('ed-desc');
  growDesc(ta); closeSugg();
  const paintPrev=wireTagFields(b,'ed',()=>{ renderTimeline(); renderTotals(); });
  ta.oninput=e=>{ b.description=e.target.value; growDesc(e.target); paintPrev();
    openSugg(el('ed-sugg'),e.target.value,v=>{ b.description=v; ta.value=v; growDesc(ta); paintPrev(); save(); renderTimeline(); });
    save(); renderTimeline(); };
  c.querySelectorAll('[data-hk]').forEach(n=>n.onclick=()=>{
    b.positionId=n.dataset.hk; save(); render();
  });
  ta.onblur=()=>setTimeout(closeSugg,120);          // let a click on a suggestion land first
  ta.onkeydown=e=>{
    if(suggKey(e)) return;
    if(e.key==='Enter'){
      // Enter commits, as before — a newline would be a lie, since the export is one cell.
      e.preventDefault(); closeSugg(); e.target.blur();
      if(e.metaKey||e.altKey||e.ctrlKey) gotoNextUnlabeled();     // commit + next open block
    } else if(e.key==='Escape'){ e.preventDefault(); closeSugg(); e.target.blur(); }
    else if(e.key==='Tab'){
      e.preventDefault(); closeSugg();
      const back=e.shiftKey&&el('ed-prj');
      if(back){ back.focus(); back.select(); return; }
      e.target.blur(); gotoBlock(e.shiftKey?-1:1);
    }
  };
  el('ed-start').onchange=e=>{ const v=parseHMok(e.target.value); if(v==null){ renderEditor(); return; } setStart(b,v); };
  if(!running) el('ed-end').onchange=e=>{ const v=parseHMok(e.target.value); if(v==null){ renderEditor(); return; } setEnd(b,v); };
  el('ed-split').onclick=()=>cutBlockAt(b.id,(b.start+bEnd(b))/2);
  el('ed-del').onclick=()=>deleteBlock(b.id);
}

function complianceOf(blocks){
  // walk chronologically: a legal break (Pause ≥15 min) must be COMPLETE before work exceeds
  // 6h (30 min) / 9h (45 min). A break booked at the end does not retroactively count.
  let work=0, brk=0, viol=null;
  for(const b of blocks){
    const dur=(bEnd(b)-b.start)/60000;
    if(b.positionId===PAUSE()){
      if(dur>=15) brk+=dur;                       // only ≥15-min chunks count as legal breaks
    } else {
      if(!viol){
        if(work<360 && work+dur>360 && brk<30) viol={at:360,need:30,have:brk};
        else if(work<540 && work+dur>540 && brk<45) viol={at:540,need:45,have:brk};
      }
      work+=dur;
    }
  }
  return {work, brk, required:(work>540?45:work>360?30:0), viol};
}
function renderTotals(){
  const c=el('totals-card'); const blocks=dayBlocks();
  const st=statsFor(blocks);
  const {work, pause, unlabeled, noWg}=st;
  let rows=Object.entries(st.per).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const p=posById(k); const sw=p?posColor(p):'var(--line)'; const lab=p?p.label:t('unlabeled');
    return `<div class="tline"><span><span class="sw" style="background:${sw}"></span>${esc(lab)}</span><span class="tabnum">${fmtDur(v)}</span></div>`;
  }).join('');
  // compliance — break must be TAKEN BY the 6h/9h mark, not summed at day's end
  const cs=complianceOf(blocks);
  const hm=m=>Math.floor(m/60)+'h'+pad(Math.round(m%60));
  let compl;
  if(cs.viol){
    compl=`<div class="compl warn">${t('breakLate',cs.viol.at/60,Math.round(cs.viol.have),cs.viol.need)}</div>`;
  } else if(cs.work<360){
    compl=`<div class="compl ok">${t('breakNone',hm(360-cs.work))}</div>`;
  } else if(cs.required>0 && cs.brk>=cs.required){
    compl=`<div class="compl ok">${t('breakOkBy',Math.round(cs.brk),cs.required>=45?'9h':'6h')}</div>`;
  } else {
    compl=`<div class="compl ok">${t('breakOk')}</div>`;
  }

  const dm=dayStartMs(), dt=dayType(dm), target=dayTargetMs(dm)/3600000;
  c.innerHTML=`<h3>${t('totals')}</h3>${rows||`<p class="dim" style="margin:0">${t('noBlocks')}</p>`}
    ${billSplitHtml(blocks)}
    <div class="ttot"><span>${t('work')}</span><span class="tabnum">${fmtDur(work)} / ${fmtHours(target)}</span></div>
    <div class="tline"><span class="dim">${t('breakRow')}</span><span class="tabnum dim">${fmtDur(pause)}</span></div>
    <div class="field" style="margin:10px 0 0"><label>${t('dayTypeLabel')}</label>
      <div class="dt-row">
        <select id="ed-daytype">
          <option value=""${dt?'':' selected'}>${isWeekday(dm)?t('dtWork'):t('dtWeekend')}</option>
          ${DAY_TYPES.map(v=>`<option value="${v}"${dt===v?' selected':''}>${t('dt_'+v)}</option>`).join('')}
        </select>
        <label class="chk" title="${esc(t('halfDayHint'))}">
          <input type="checkbox" id="ed-half" ${isHalfDay(dm)?'checked':''} ${dt?'':'disabled'}> ${t('halfDay')}
        </label>
      </div></div>
    ${unlabeled?issueBtn('unlabeled',dm,1,t('unlabeledWarn',unlabeled)):''}
    ${noWg?issueBtn('noWg',dm,1,t('noWgWarn',noWg)):''}
    ${compl}`;
  // The fraction only means anything once a type is chosen, so it follows the select.
  el('ed-daytype').onchange=e=>{ setDayType(dm,e.target.value||null,el('ed-half').checked); render(); };
  el('ed-half').onchange=e=>{ setDayType(dm,dayType(dm),e.target.checked); render(); };
}

// Factura vs Internal — the orthogonal axis, shown as one glanceable bar.
function billSplitHtml(blocks){
  const sp=splitBillable(blocks), work=sp.fact+sp.intern;
  if(!work) return '';
  const pf=Math.round(sp.fact/work*100);
  return `<div class="split">
      <i style="width:${sp.fact/work*100}%;background:var(--accent-bright)"></i>
      <i style="width:${sp.intern/work*100}%;background:var(--intern)"></i>
    </div>
    <div class="splitleg">
      <span><i style="background:var(--accent-bright)"></i>${t('factura')} <b class="tabnum">${fmtDur(sp.fact)}</b> <span class="dim">${pf}%</span></span>
      <span><i style="background:var(--intern)"></i>${t('internal')} <b class="tabnum">${fmtDur(sp.intern)}</b> <span class="dim">${100-pf}%</span></span>
    </div>`;
}
/* ===================== input helpers — recall & tagging ===================== */
/* --- description recall ---
   A <textarea> can't carry a <datalist>, so the "descriptions I've typed before" affordance
   is rebuilt here: newest first, prefix matches ahead of substring matches, keyboard-driven.
   It stays out of the way — it only opens once something is typed. --- */
let suggItems=[], suggI=-1, suggAccept=null, suggBoxEl=null;
function descPool(){
  const seen=new Set(), out=[];
  for(let i=state.blocks.length-1;i>=0;i--){       // newest first: recent work repeats most
    const d=(state.blocks[i].description||'').trim();
    if(d&&!seen.has(d)){ seen.add(d); out.push(d); }
  }
  return out;
}
function growDesc(ta){ if(!ta) return; ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
function closeSugg(){ if(suggBoxEl){ suggBoxEl.hidden=true; suggBoxEl.innerHTML=''; } suggBoxEl=null; suggAccept=null; suggItems=[]; suggI=-1; }
// `opts.pool` swaps the candidate list (the tag fields feed their own), `opts.all` opens
// the list on an empty field — right for a short tag vocabulary, wrong for free text.
function openSugg(box,q,accept,opts){
  if(!box) return;
  opts=opts||{};
  const max=opts.max||6;
  q=(q||'').trim().toLowerCase();
  const pool=(opts.pool||descPool)().filter(d=>d.toLowerCase()!==q);
  if(!q){
    if(!opts.all){ closeSugg(); return; }
    suggItems=pool.slice(0,max);
  } else {
    const pre=pool.filter(d=>d.toLowerCase().startsWith(q));
    suggItems=pre.concat(pool.filter(d=>!d.toLowerCase().startsWith(q)&&d.toLowerCase().includes(q))).slice(0,max);
  }
  if(!suggItems.length){ closeSugg(); return; }
  suggI=-1; suggBoxEl=box; suggAccept=accept;
  box.innerHTML=suggItems.map((d,i)=>`<div data-s="${i}">${esc(d)}</div>`).join('');
  box.hidden=false;
  // The rail scrolls, so a list opened near its bottom edge would fall out of sight —
  // flip it above the field when there is more room there.
  box.style.top=''; box.style.bottom=''; box.style.margin='';
  const sc=box.closest('#rail')||document.body;
  const br=box.getBoundingClientRect(), sr=sc.getBoundingClientRect();
  if(br.bottom>sr.bottom && (br.top-sr.top)>(sr.bottom-br.top)){
    box.style.top='auto'; box.style.bottom='100%'; box.style.margin='0 0 2px';
  }
  // mousedown, not click: the textarea's blur would tear the list down first
  box.querySelectorAll('[data-s]').forEach(n=>n.onmousedown=e=>{ e.preventDefault(); suggPick(+n.dataset.s); });
}
function paintSugg(){
  const box=suggBoxEl; if(!box) return;
  box.querySelectorAll('[data-s]').forEach(n=>n.classList.toggle('on',+n.dataset.s===suggI));
}
function suggPick(i){
  const v=suggItems[i]; if(v==null) return;
  const ta=suggBoxEl&&suggBoxEl.parentNode.querySelector('textarea,input');
  if(suggAccept) suggAccept(v);
  closeSugg();
  if(ta) ta.focus();
}
// Returns true when the keystroke belonged to the suggestion list, so the editor's own
// Enter/Tab/Escape handling stays untouched whenever the list is closed.
function suggKey(e){
  if(!suggItems.length) return false;
  if(e.key==='ArrowDown'){ e.preventDefault(); suggI=(suggI+1)%suggItems.length; paintSugg(); return true; }
  if(e.key==='ArrowUp'){ e.preventDefault(); suggI=(suggI-1+suggItems.length)%suggItems.length; paintSugg(); return true; }
  if((e.key==='Enter'||e.key==='Tab')&&suggI>=0){ e.preventDefault(); suggPick(suggI); return true; }
  if(e.key==='Escape'){ e.preventDefault(); closeSugg(); return true; }
  return false;
}

/* --- tag recall ---
   The curated vocabulary is the tree itself: the Hub and PEG rows under a booking code are
   the tags the unit hands out. Anything typed ad hoc is picked up from history behind it,
   so a PEG that appears mid-day needs no bookkeeping first. PEGs are narrowed to the Hub in
   the field above, since that pairing is what the rows encode. --- */
function tagPool(f,b){
  const bc=bookingCodeOf(posById(b&&b.positionId));
  const wg=f==='prj' ? effTag(b,'wg') : '';
  const seen=new Set(), out=[];
  const push=v=>{ v=(v||'').trim(); if(v&&!seen.has(v)){ seen.add(v); out.push(v); } };
  if(bc) state.positions.filter(x=>x.parentId===bc.id&&!x.archived)
    .filter(x=>f==='wg'||!wg||!x.wg||x.wg===wg)
    .forEach(x=>push(x[f]));
  for(let i=state.blocks.length-1;i>=0;i--){          // newest first, as with descriptions
    const ob=state.blocks[i];
    if(!ob[f]) continue;
    if(f==='prj'&&wg&&effTag(ob,'wg')!==wg) continue;
    push(ob[f]);
  }
  return out;
}
// The two tag fields, shown only on a Themenarbeit position. Both are prefilled from the
// Hub or PEG row, so a PEG row leaves nothing but the text to type.
function tagFieldsHtml(b,pre){
  if(!isTaggedBlock(b)) return '';
  const f=(k,lab,ph)=>`<div class="field"><label>${lab}</label>
      <div class="desc-wrap">
        <input type="text" id="${pre}-${k}" class="taginp" spellcheck="false" autocomplete="off"
               placeholder="${ph}" value="${esc(effTag(b,k))}">
        <div class="sugg" id="${pre}-${k}s" hidden></div>
      </div></div>`;
  return `<div class="row">${f('wg',t('wgTag'),t('wgPh'))}${f('prj',t('prjTag'),esc(tagNone()))}</div>`;
}
// Wires both fields and keeps the composed-cell preview under the description live.
function wireTagFields(b,pre,after){
  const prev=el(pre+'-prev');
  const paint=()=>{ if(prev) prev.textContent=composedDesc(b); };
  paint();
  if(!isTaggedBlock(b)) return paint;
  ['wg','prj'].forEach(k=>{
    const inp=el(pre+'-'+k); if(!inp) return;
    const box=el(pre+'-'+k+'s');
    const opts={pool:()=>tagPool(k,b),all:true,max:8};
    // Typing exactly what the row already supplies is not an override — storing it would
    // freeze the block against a later rename of that row. Anything else, a deliberate
    // blank included, is kept on the block.
    const set=v=>{
      const c=cleanTag(v), inherited=((presetOf(b)||{})[k])||'';
      b[k] = c===inherited ? null : c;
      save(); paint(); after();
    };
    // Focusing a tag field almost always means changing it, so the whole (short) vocabulary
    // opens — filtering by the value already in the box would hide every alternative.
    inp.onfocus=()=>openSugg(box,'',v=>{ inp.value=v; set(v); },opts);
    inp.oninput=e=>{ set(e.target.value); openSugg(box,e.target.value,v=>{ inp.value=v; set(v); },opts); };
    inp.onblur=()=>setTimeout(closeSugg,120);
    inp.onkeydown=e=>{
      if(suggKey(e)) return;
      // Tab walks Hub → PEG → description; leaving the description still leaves
      // the block, so the end of the chain behaves exactly as before.
      if(e.key==='Enter'||e.key==='Tab'){
        e.preventDefault(); closeSugg();
        const nxt=e.shiftKey ? (k==='prj'?el(pre+'-wg'):null)
                             : (k==='wg'?el(pre+'-prj'):el(pre+'-desc'));
        if(nxt){ nxt.focus(); nxt.select&&nxt.select(); } else inp.blur();
      } else if(e.key==='Escape'){ e.preventDefault(); closeSugg(); inp.blur(); }
    };
  });
  return paint;
}

/* ============================ live loop actions ============================ */
// A live boundary is an edit like any other, so it lands on the same grid the timeline snaps
// to. Snapping relative to the timestamp's OWN midnight (not the selected day's) keeps it
// correct across midnight and DST. `floorMs` is the earliest legal value — the start of the
// block being closed, or the end of the previous one. If snapping would leave that block
// shorter than one grid step, we keep the real clock time: a zero-length or inverted block
// is a worse lie than an unsnapped one.
function snapLiveMs(ms,floorMs){
  if(!S().snapLive) return ms;
  const mid=new Date(ms); mid.setHours(0,0,0,0);
  const g=S().snapMin;
  const snapped=mid.getTime()+Math.round((ms-mid.getTime())/60000/g)*g*60000;
  if(floorMs!=null && snapped<floorMs+g*60000) return ms;
  return snapped;
}
function lastEndBefore(ms){
  let out=null;
  state.blocks.forEach(b=>{ if(b.end!=null&&b.end<=ms&&(out==null||b.end>out)) out=b.end; });
  return out;
}
function startDay(){ if(runningBlock())return; const n=now(); const s=snapLiveMs(n,lastEndBefore(n)); const b={id:uid('b'),start:s,end:null,positionId:null,description:''}; state.blocks.push(b); selectedId=b.id; save(); render(); }
function switchTask(){ const r=runningBlock(); if(!r)return; r.end=snapLiveMs(now(),r.start); const b={id:uid('b'),start:r.end,end:null,positionId:null,description:''}; state.blocks.push(b); selectedId=b.id; save(); render(); }
function breakNow(){ const r=runningBlock(); if(!r)return; r.end=snapLiveMs(now(),r.start); const b={id:uid('b'),start:r.end,end:null,positionId:PAUSE(),description:''}; state.blocks.push(b); selectedId=b.id; save(); render(); }
function stopDay(){ const r=runningBlock(); if(!r)return; r.end=snapLiveMs(now(),r.start); save(); render(); }

/* ============================ editing ============================ */
function selectBlock(id){
  selectedId=id;
  if(isNarrow()) document.body.classList.add('show-rail');   // the editor lives in the rail
  render();
}
function setStart(b,ms){
  ms=snapMs(ms);
  if(ms>=bEnd(b)-S().snapMin*60000) return;
  const prev=dayBlocks().find(x=>Math.abs(x.end-b.start)<1000);
  if(prev){ if(ms<=prev.start+S().snapMin*60000) return; prev.end=ms; }
  b.start=ms; save(); render();
}
function setEnd(b,ms){
  ms=snapMs(ms);
  if(ms<=b.start+S().snapMin*60000) return;
  const next=dayBlocks().find(x=>Math.abs(x.start-b.end)<1000);
  if(next){ if(ms>=bEnd(next)-S().snapMin*60000) return; next.start=ms; }
  b.end=ms; save(); render();
}
function cutBlockAt(id,ms){
  const b=state.blocks.find(x=>x.id===id); if(!b)return;
  ms=snapMs(ms); const min=S().snapMin*60000;
  if(ms<=b.start+min || ms>=bEnd(b)-min){ toast(t('tTooSmall')); return; }
  const oldEnd=b.end;
  const nb={id:uid('b'),start:ms,end:oldEnd,positionId:b.positionId,description:b.description,wg:b.wg,prj:b.prj};
  b.end=ms; state.blocks.push(nb); selectedId=nb.id; save(); render();
}
function mergeSeam(i){
  const bl=dayBlocks(); const a=bl[i], c=bl[i+1]; if(!a||!c)return;
  const aLong=(bEnd(a)-a.start)>=(bEnd(c)-c.start); const keep=aLong?a:c;
  a.positionId=keep.positionId; a.description=keep.description; a.end=c.end;
  a.wg=keep.wg; a.prj=keep.prj;
  state.blocks=state.blocks.filter(x=>x.id!==c.id); selectedId=a.id; save(); render();
  toast(t('tMerged', posById(keep.positionId)?.label||t('unlabeled')));
}
function deleteBlock(id){
  const bl=dayBlocks(); const b=bl.find(x=>x.id===id); if(!b)return; const idx=bl.indexOf(b);
  const prev=bl[idx-1], next=bl[idx+1];
  if(prev&&Math.abs(prev.end-b.start)<1000) prev.end=b.end;            // absorb into previous
  else if(next&&Math.abs(next.start-b.end)<1000) next.start=b.start;   // else into next
  state.blocks=state.blocks.filter(x=>x.id!==id); selectedId=null; save(); render();
}

/* ============================ timeline interactions ============================ */
function yToMs(clientY){
  const r=el('timeline').getBoundingClientRect();
  const min=curWinStart + (clientY-r.top)/PPM;
  return dayStartMs()+min*60000;
}
el('timeline').addEventListener('mousedown',e=>{
  // marker: grab its line anywhere, its handle, or anywhere on the gutter rail
  if(e.target.closest('#gutter')||e.target.closest('.ph-hit')||e.target.closest('.ph-handle')){ startPlayheadDrag(e); return; }
  const r=el('timeline').getBoundingClientRect();
  if(e.clientX < r.left) return;                 // left ruler → playhead (handled on wrap)
  const mrg=e.target.closest('[data-merge]'); if(mrg){ e.preventDefault(); mergeSeam(+mrg.dataset.merge); return; }
  const seam=e.target.closest('[data-seam]'); if(seam){ startSeamDrag(+seam.dataset.seam,e); return; }
  const blk=e.target.closest('[data-id]');
  if(blk){
    if(e.target.closest('.rz-top')){ startEdgeDrag(blk.dataset.id,'start',e); return; }
    if(e.target.closest('.rz-bot')){ startEdgeDrag(blk.dataset.id,'end',e); return; }
    startBlockPointer(blk.dataset.id,e); return;
  }
  startDraw(e);
});
el('timeline-wrap').addEventListener('mousedown',e=>{
  const r=el('timeline').getBoundingClientRect();
  if(e.clientX < r.left) startPlayheadDrag(e);
});
el('timeline').addEventListener('mousemove',e=>{                 // gutter hover preview
  const g=el('gutter'); if(!g) return;
  const gh=g.querySelector('.gh'); if(!gh) return;
  if(e.target.closest('#gutter')){
    const r=el('timeline').getBoundingClientRect();
    gh.style.top=((snapMs(yToMs(e.clientY))-dayStartMs())/60000-curWinStart)*PPM+'px';
  }
});
function startPlayheadDrag(e){
  e.preventDefault(); drag.active=true;
  const set=ev=>{ let ms=snapMs(yToMs(ev.clientY)); ms=Math.max(dayStartMs(),Math.min(dayStartMs()+DAY,ms)); playhead=ms; renderTimeline(); };
  set(e);
  const up=()=>{ drag.active=false; document.removeEventListener('mousemove',set); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',set); document.addEventListener('mouseup',up);
}
function startBlockPointer(id,e){
  e.preventDefault();
  const b=state.blocks.find(x=>x.id===id); if(!b)return;
  if(b.end==null){ selectBlock(id); return; }       // running block: select only
  const startY=e.clientY, grab=yToMs(e.clientY)-b.start, dur=b.end-b.start;
  const bl=dayBlocks(), idx=bl.indexOf(b);
  const lower=idx>0?bl[idx-1].end:dayStartMs();
  const upper=idx<bl.length-1?bl[idx+1].start:dayStartMs()+DAY;
  let moved=false;
  const move=ev=>{
    if(!moved && Math.abs(ev.clientY-startY)<3) return;
    moved=true; drag.active=true;
    let ns=snapMs(yToMs(ev.clientY)-grab);
    ns=Math.max(lower,Math.min(upper-dur,ns));
    b.start=ns; b.end=ns+dur; renderTimeline();
  };
  const up=()=>{ drag.active=false; document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); if(moved){ save(); render(); } else selectBlock(id); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function startEdgeDrag(id,which,e){
  e.preventDefault(); drag.active=true;
  const b=state.blocks.find(x=>x.id===id); if(!b)return;
  const bl=dayBlocks(), idx=bl.indexOf(b), min=S().snapMin*60000;
  const lower=idx>0?bl[idx-1].end:dayStartMs();
  const upper=idx<bl.length-1?bl[idx+1].start:dayStartMs()+DAY;
  const move=ev=>{
    let ms=snapMs(yToMs(ev.clientY));
    if(which==='start') b.start=Math.max(lower,Math.min(bEnd(b)-min,ms));
    else b.end=Math.max(b.start+min,Math.min(upper,ms));
    renderTimeline(); renderTotals();
  };
  const up=()=>{ drag.active=false; document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); save(); render(); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function splitAtPlayhead(){
  const b=dayBlocks().find(x=>x.start<playhead && bEnd(x)>playhead);
  if(!b){ toast(t('tMoveMarker')); return; }
  cutBlockAt(b.id, playhead);
}
function mergeSelected(){
  const bl=dayBlocks(), b=bl.find(x=>x.id===selectedId);
  if(!b){ toast(t('tSelectFirst')); return; }
  const i=bl.indexOf(b);
  if(i>0 && Math.abs(bl[i-1].end-b.start)<1000) mergeSeam(i-1);
  else if(i<bl.length-1 && Math.abs(b.end-bl[i+1].start)<1000) mergeSeam(i);
  else toast(t('tNoAdjacent'));
}
function nudgePlayhead(dir){
  playhead=(playhead||dayStartMs())+dir*S().snapMin*60000;
  playhead=Math.max(dayStartMs(),Math.min(dayStartMs()+DAY,playhead));
  renderTimeline();
}
function startSeamDrag(i,e){
  e.preventDefault(); const bl=dayBlocks(); const a=bl[i], c=bl[i+1]; if(!a||!c)return;
  drag.active=true; const min=S().snapMin*60000;
  const move=ev=>{ let ms=snapMs(yToMs(ev.clientY)); ms=Math.max(a.start+min,Math.min(bEnd(c)-min,ms)); a.end=ms; c.start=ms; renderTimeline(); renderTotals(); };
  const up=()=>{ drag.active=false; document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); save(); render(); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function startDraw(e){
  e.preventDefault(); const t0=snapMs(yToMs(e.clientY)); drag.active=true;
  // free region around t0 (off-clock)
  const bl=dayBlocks();
  let lo=dayStartMs(), hi=dayStartMs()+DAY;
  bl.forEach(b=>{ if(bEnd(b)<=t0) lo=Math.max(lo,bEnd(b)); if(b.start>=t0) hi=Math.min(hi,b.start); });
  if(bl.some(b=>t0>b.start&&t0<bEnd(b))){ drag.active=false; return; }
  const g=el('ghost'); g.style.display='block';
  const move=ev=>{ let t1=snapMs(yToMs(ev.clientY)); t1=Math.max(lo,Math.min(hi,t1));
    const s=Math.min(t0,t1), en=Math.max(t0,t1);
    g.style.top=((minOfDay(s)-curWinStart)*PPM)+'px'; g.style.height=((en-s)/60000*PPM)+'px'; };
  const up=ev=>{ drag.active=false; g.style.display='none'; document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    let t1=snapMs(yToMs(ev.clientY)); t1=Math.max(lo,Math.min(hi,t1));
    const s=Math.min(t0,t1), en=Math.max(t0,t1);
    if(en-s>=S().snapMin*60000){ const b={id:uid('b'),start:s,end:en,positionId:null,description:''}; state.blocks.push(b); selectedId=b.id; save(); render(); }
  };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

// One step means one unit of whatever is on screen.
function stepDate(dir){
  if(viewMode==='week') return addDays(selectedDate,dir*7);
  if(viewMode==='month'){ const x=new Date(selectedDate); x.setDate(1); x.setMonth(x.getMonth()+dir); x.setHours(0,0,0,0); return x; }
  return addDays(selectedDate,dir);
}
